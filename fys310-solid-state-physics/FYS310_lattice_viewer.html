<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lattice Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/fys310-solid-state-physics.css">
<link rel="stylesheet" href="../assets/css/applet.css">
<style>
  :root {
    --accent-text: #ffffff;
    --corner: #64748b; --face: #2563eb; --body: #dc2626; --interior: #059669;
    --bond: #94a3b8; --edge: rgba(90,95,110,0.55); --primitive: #d97706; --gamma: #ca8a04;
    --recip-zone: #0e7490; --recip-face: #0891b2; --recip-edge: #7c3aed; --recip-corner: #e11d48;
    --ws: #0d9488; --path: #db2777;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --corner: #9aa4b2; --face: #60a5fa; --body: #f87171; --interior: #34d399;
      --bond: #6b7280; --edge: rgba(200,205,220,0.35); --primitive: #fbbf24; --gamma: #fbbf24;
      --recip-zone: #22d3ee; --recip-face: #38bdf8; --recip-edge: #a78bfa; --recip-corner: #fb7185;
      --ws: #2dd4bf; --path: #f472b6;
    }
  }
  :root[data-theme="dark"] {
    --corner: #9aa4b2; --face: #60a5fa; --body: #f87171; --interior: #34d399;
    --bond: #6b7280; --edge: rgba(200,205,220,0.35); --primitive: #fbbf24; --gamma: #fbbf24;
    --recip-zone: #22d3ee; --recip-face: #38bdf8; --recip-edge: #a78bfa; --recip-corner: #fb7185;
    --ws: #2dd4bf; --path: #f472b6;
  }
  html, body { height: 100%; overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
  header { padding: 14px 16px 10px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); flex-shrink: 0; }
  header h1 { margin: 0 0 2px 0; }
  header p { margin: 0; }
  #canvas-wrap { position: relative; flex: 1; min-height: 0; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #controls {
    flex-shrink: 0;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px)) 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .row::-webkit-scrollbar { display: none; }
  #modeRow { margin-bottom: 4px; }
  .chip { flex: 0 0 auto; white-space: nowrap; }
  #info { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #desc { font-size: var(--fs-label); color: var(--text-dim); line-height: 1.4; flex: 1; }
  #desc b { color: var(--text); }
  #legend { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-small); color: var(--text-dim); flex-shrink: 0; margin-top: 0; }
  .legend-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dash-swatch { width: 14px; height: 0; border-top: 2px dashed var(--primitive); flex-shrink: 0; }
  .ws-swatch { width: 14px; height: 0; border-top: 2px solid var(--ws); flex-shrink: 0; }
  #toolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 5; }
  .icon-btn { width: 34px; height: 34px; padding: 0; font-size: 15px; display: flex; align-items: center; justify-content: center; opacity: 0.92; }
  #hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: var(--fs-small); color: var(--text-dim);
    background: var(--panel); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
    opacity: 0.85; pointer-events: none; transition: opacity 0.4s;
  }

  #disp {
    display: none;
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    touch-action: none;
    cursor: crosshair;
  }
  #disp svg { display: block; }
  #view2d { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; }
  #view2d svg { display: block; width: 100%; height: 100%; }
  #ctl2d { display: none; }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
    padding: 0 0 6px 0;
  }
  .slider-row > span:first-child { min-width: 78px; }
  .slider-row .val { min-width: 44px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Lattice Viewer</h1>
    <p>3D lattices, Brillouin zones with empty-lattice bands, and 2D Bravais lattices</p>
  </header>

  <div id="canvas-wrap">
    <div id="toolbar">
      <button class="icon-btn active" id="rotateBtn" title="Auto-rotate">&#8635;</button>
      <button class="icon-btn" id="primBtn" title="Show primitive cell">&#9649;</button>
      <button class="icon-btn" id="wsBtn" title="Show Wigner-Seitz cell">&#11041;</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">&#9788;</button>
    </div>
    <div id="view2d"></div>
    <div id="hint">Drag to rotate</div>
  </div>

  <div id="disp"></div>

  <div id="controls">
    <div class="row" id="modeRow">
      <button class="chip active" data-mode="real">Real space</button>
      <button class="chip" data-mode="reciprocal">Reciprocal / BZ</button>
      <button class="chip" data-mode="2d">2D lattices</button>
    </div>
    <div class="row" id="chipRow"></div>
    <div class="row" id="pathRow" style="display:none;"></div>
    <div id="ctl2d">
      <div class="row" id="spaceRow"></div>
      <div id="sliders"></div>
    </div>
    <div id="info">
      <div id="desc"></div>
      <div id="legend"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var C_A = 1.633; // ideal c/a
  var PRIMS = {
    sc:  [[1,0,0],[0,1,0],[0,0,1]],
    bcc: [[-0.5,0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,-0.5]],
    fcc: [[0,0.5,0.5],[0.5,0,0.5],[0.5,0.5,0]],
    hcp: [[1,0,0],[-0.5,Math.sqrt(3)/2,0],[0,0,C_A]]
  };
  PRIMS.diamond = PRIMS.fcc;

  // ---------- Lattice geometry generators ----------
  function cubeCorners() {
    var pts = [];
    for (var x = 0; x <= 1; x++)
      for (var y = 0; y <= 1; y++)
        for (var z = 0; z <= 1; z++)
          pts.push([x, y, z]);
    return pts;
  }
  function cubeEdges(corners) {
    var edges = [];
    for (var i = 0; i < corners.length; i++) {
      for (var j = i + 1; j < corners.length; j++) {
        var a = corners[i], b = corners[j];
        var diff = Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]);
        if (Math.abs(diff - 1) < 1e-6) edges.push([a, b]);
      }
    }
    return edges;
  }
  function dist(a, b) {
    return Math.sqrt(Math.pow(a[0]-b[0],2) + Math.pow(a[1]-b[1],2) + Math.pow(a[2]-b[2],2));
  }

  // 12 index-space edges (0/1 combinations) reused to build any parallelepiped's wireframe
  var UNIT_EDGES = cubeEdges(cubeCorners());
  function primitiveEdges(prim) {
    function map(idx) {
      return [
        prim.origin[0] + idx[0]*prim.a1[0] + idx[1]*prim.a2[0] + idx[2]*prim.a3[0],
        prim.origin[1] + idx[0]*prim.a1[1] + idx[1]*prim.a2[1] + idx[2]*prim.a3[1],
        prim.origin[2] + idx[0]*prim.a1[2] + idx[1]*prim.a2[2] + idx[2]*prim.a3[2]
      ];
    }
    return UNIT_EDGES.map(function(e){ return [map(e[0]), map(e[1])]; });
  }

  // Reconstructs wireframe edges for convex polytopes whose edges all share
  // one uniform length (true for the cube, truncated octahedron and rhombic
  // dodecahedron used as Brillouin zones below): connect every vertex pair
  // sitting at the minimum pairwise distance.
  function minDistanceEdges(verts) {
    var n = verts.length, pairs = [], minD = Infinity;
    for (var i = 0; i < n; i++) {
      for (var j = i + 1; j < n; j++) {
        var d = dist(verts[i], verts[j]);
        pairs.push({ a: verts[i], b: verts[j], d: d });
        if (d < minD) minD = d;
      }
    }
    var tol = minD * 0.01;
    var edges = [];
    pairs.forEach(function(p) { if (p.d <= minD + tol) edges.push([p.a, p.b]); });
    return edges;
  }

  // Solve the 3x3 linear system {p1,p2,p3}*x = {r1,r2,r3} via Cramer's rule.
  function solve3x3(p1, p2, p3, r1, r2, r3) {
    var det = p1[0]*(p2[1]*p3[2]-p2[2]*p3[1]) - p1[1]*(p2[0]*p3[2]-p2[2]*p3[0]) + p1[2]*(p2[0]*p3[1]-p2[1]*p3[0]);
    if (Math.abs(det) < 1e-9) return null;
    function detWithCol(col, vals) {
      var m = [p1.slice(), p2.slice(), p3.slice()];
      m[0][col] = vals[0]; m[1][col] = vals[1]; m[2][col] = vals[2];
      return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1]) - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0]) + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
    }
    var dx = detWithCol(0, [r1,r2,r3]), dy = detWithCol(1, [r1,r2,r3]), dz = detWithCol(2, [r1,r2,r3]);
    return [dx/det, dy/det, dz/det];
  }

  // Wigner-Seitz / Voronoi cell vertices around the origin, given a shell of
  // neighboring lattice points: intersects every triple of perpendicular-
  // bisector planes and keeps the ones that satisfy every plane's half-space.
  function voronoiVertices(neighbors) {
    var planes = neighbors.map(function(p){ return { p: p, rhs: (p[0]*p[0]+p[1]*p[1]+p[2]*p[2]) / 2 }; });
    var verts = [], seen = {};
    for (var i = 0; i < planes.length; i++) {
      for (var j = i + 1; j < planes.length; j++) {
        for (var k = j + 1; k < planes.length; k++) {
          var sol = solve3x3(planes[i].p, planes[j].p, planes[k].p, planes[i].rhs, planes[j].rhs, planes[k].rhs);
          if (!sol) continue;
          var ok = true;
          for (var m = 0; m < planes.length; m++) {
            var lhs = sol[0]*planes[m].p[0] + sol[1]*planes[m].p[1] + sol[2]*planes[m].p[2];
            if (lhs > planes[m].rhs + 1e-6) { ok = false; break; }
          }
          if (ok) {
            var key = sol.map(function(v){ return Math.round(v*1000); }).join(',');
            if (!seen[key]) { seen[key] = 1; verts.push(sol); }
          }
        }
      }
    }
    return verts;
  }

  function buildSC() {
    var corners = cubeCorners();
    return {
      atoms: corners.map(function(p){ return {pos:p, type:'corner'}; }),
      edges: cubeEdges(corners),
      bonds: [],
      center: [0.5,0.5,0.5],
      camDist: 3.0,
      primitive: { origin:[0,0,0], a1:PRIMS.sc[0], a2:PRIMS.sc[1], a3:PRIMS.sc[2] },
      primNote: 'Primitive cell = conventional cell for SC.'
    };
  }

  function buildBCC() {
    var corners = cubeCorners();
    var atoms = corners.map(function(p){ return {pos:p, type:'corner'}; });
    atoms.push({pos:[0.5,0.5,0.5], type:'body'});
    return { atoms: atoms, edges: cubeEdges(corners), bonds: [], center:[0.5,0.5,0.5], camDist: 3.0,
      primitive: { origin:[0,0,0], a1:PRIMS.bcc[0], a2:PRIMS.bcc[1], a3:PRIMS.bcc[2] },
      primNote: 'Rhombohedral primitive cell, volume = &frac12; of the conventional cell (1 atom vs. 2); it does not have to fit inside the cube.' };
  }

  function buildFCC() {
    var corners = cubeCorners();
    var faces = [[0.5,0.5,0],[0.5,0.5,1],[0.5,0,0.5],[0.5,1,0.5],[0,0.5,0.5],[1,0.5,0.5]];
    var atoms = corners.map(function(p){ return {pos:p, type:'corner'}; })
      .concat(faces.map(function(p){ return {pos:p, type:'face'}; }));
    return { atoms: atoms, edges: cubeEdges(corners), bonds: [], center:[0.5,0.5,0.5], camDist: 3.0,
      primitive: { origin:[0,0,0], a1:PRIMS.fcc[0], a2:PRIMS.fcc[1], a3:PRIMS.fcc[2] },
      primNote: 'Rhombohedral primitive cell &mdash; &frac14; of the conventional cell (1 atom vs. 4).' };
  }

  function buildDiamond() {
    var corners = cubeCorners();
    var faces = [[0.5,0.5,0],[0.5,0.5,1],[0.5,0,0.5],[0.5,1,0.5],[0,0.5,0.5],[1,0.5,0.5]];
    var fccPts = corners.concat(faces);
    var interior = [[0.25,0.25,0.25],[0.75,0.75,0.25],[0.75,0.25,0.75],[0.25,0.75,0.75]];
    var atoms = corners.map(function(p){ return {pos:p, type:'corner'}; })
      .concat(faces.map(function(p){ return {pos:p, type:'face'}; }))
      .concat(interior.map(function(p){ return {pos:p, type:'interior'}; }));
    var bonds = [];
    interior.forEach(function(ip) {
      var withDist = fccPts.map(function(fp){ return {p: fp, d: dist(ip, fp)}; });
      withDist.sort(function(a,b){ return a.d - b.d; });
      for (var k = 0; k < 4; k++) bonds.push([ip, withDist[k].p]);
    });
    return { atoms: atoms, edges: cubeEdges(corners), bonds: bonds, center:[0.5,0.5,0.5], camDist: 3.1,
      primitive: { origin:[0,0,0], a1:PRIMS.fcc[0], a2:PRIMS.fcc[1], a3:PRIMS.fcc[2] },
      primNote: 'Same FCC primitive cell, now with a 2-atom basis (1 lattice point + 1 basis atom).' };
  }

  function buildHCP() {
    var atoms = [], edges = [];
    var topHex = [], botHex = [];
    var c = 1.633; // ideal c/a
    for (var i = 0; i < 6; i++) {
      var ang = i * Math.PI / 3;
      var x = Math.cos(ang), y = Math.sin(ang);
      topHex.push([x, y, c]);
      botHex.push([x, y, 0]);
    }
    topHex.forEach(function(p){ atoms.push({pos:p, type:'corner'}); });
    botHex.forEach(function(p){ atoms.push({pos:p, type:'corner'}); });
    atoms.push({pos:[0,0,c], type:'corner'});
    atoms.push({pos:[0,0,0], type:'corner'});
    // interior mid-plane atoms (ABAB stacking)
    var interior = [];
    for (var j = 0; j < 3; j++) {
      var a2 = (Math.PI/3) * (2*j) + Math.PI/6;
      interior.push([0.577*Math.cos(a2), 0.577*Math.sin(a2), c/2]);
    }
    interior.forEach(function(p){ atoms.push({pos:p, type:'interior'}); });

    for (var k = 0; k < 6; k++) {
      edges.push([topHex[k], topHex[(k+1)%6]]);
      edges.push([botHex[k], botHex[(k+1)%6]]);
      edges.push([topHex[k], botHex[k]]);
    }
    return { atoms: atoms, edges: edges, bonds: [], center:[0,0,c/2], camDist: 3.6,
      primitive: { origin:[0,0,0], a1:PRIMS.hcp[0], a2:PRIMS.hcp[1], a3:PRIMS.hcp[2] },
      primNote: 'Rhombic prism &mdash; 1 of 3 primitive cells making up the hexagonal prism shown (2 atoms each).' };
  }

  // ---------- Reciprocal-lattice / Brillouin-zone generators ----------
  // Coordinates are schematic (not physical 2pi/a units) but preserve the
  // correct relative geometry, so vertices double as the standard
  // high-symmetry k-points (matching the labels used in the course booklet).
  function buildSCRecip() {
    var v = [];
    [-1,1].forEach(function(x){ [-1,1].forEach(function(y){ [-1,1].forEach(function(z){ v.push([x,y,z]); }); }); });
    return {
      vertices: v, edges: minDistanceEdges(v), center:[0,0,0], camDist: 3.6,
      shapeName: 'Cube', dualName: 'Simple Cubic',
      highSym: [
        {name:'\u0393', pos:[0,0,0], role:'gamma'},
        {name:'X', pos:[1,0,0], role:'face'},
        {name:'M', pos:[1,1,0], role:'edge'},
        {name:'R', pos:[1,1,1], role:'corner'}
      ]
    };
  }

  function buildBCCRecip() {
    var v = [[2,0,0],[-2,0,0],[0,2,0],[0,-2,0],[0,0,2],[0,0,-2]];
    [-1,1].forEach(function(x){ [-1,1].forEach(function(y){ [-1,1].forEach(function(z){ v.push([x,y,z]); }); }); });
    return {
      vertices: v, edges: minDistanceEdges(v), center:[0,0,0], camDist: 5.4,
      shapeName: 'Rhombic dodecahedron', dualName: 'Face-Centered Cubic',
      highSym: [
        {name:'\u0393', pos:[0,0,0], role:'gamma'},
        {name:'N', pos:[1,1,0], role:'face'},
        {name:'H', pos:[2,0,0], role:'edge'},
        {name:'P', pos:[1,1,1], role:'corner'}
      ]
    };
  }

  function buildFCCRecip() {
    // Vertices = all permutations of (0, +-1, +-2): the permutohedron, i.e.
    // the truncated octahedron that is the FCC lattice's first Brillouin zone.
    var base = [0,1,2], perms = [];
    (function permute(a, k){
      if (k === a.length) { perms.push(a.slice()); return; }
      for (var i = k; i < a.length; i++) {
        var t = a[k]; a[k] = a[i]; a[i] = t;
        permute(a, k+1);
        t = a[k]; a[k] = a[i]; a[i] = t;
      }
    })(base.slice(), 0);
    var v = [], seen = {};
    perms.forEach(function(pm) {
      var s0 = pm[0] === 0 ? [1] : [1,-1];
      var s1 = pm[1] === 0 ? [1] : [1,-1];
      var s2 = pm[2] === 0 ? [1] : [1,-1];
      s0.forEach(function(a){ s1.forEach(function(b){ s2.forEach(function(c){
        var p = [pm[0]*a, pm[1]*b, pm[2]*c];
        var key = p.join(',');
        if (!seen[key]) { seen[key] = 1; v.push(p); }
      }); }); });
    });
    return {
      vertices: v, edges: minDistanceEdges(v), center:[0,0,0], camDist: 5.6,
      shapeName: 'Truncated octahedron', dualName: 'Body-Centered Cubic',
      highSym: [
        {name:'\u0393', pos:[0,0,0], role:'gamma'},
        {name:'X', pos:[2,0,0], role:'face'},
        {name:'L', pos:[1,1,1], role:'face'},
        {name:'K', pos:[1.5,1.5,0], role:'edge'},
        {name:'U', pos:[2,0.5,0.5], role:'edge'},
        {name:'W', pos:[2,1,0], role:'corner'}
      ]
    };
  }

  function buildHCPRecip() {
    // true-scale hexagonal BZ: schematic coords = 2 x k (k in 2*pi/a), like the cubic zones
    var R = 4/3, h = 1/C_A;
    var top = [], bot = [];
    for (var i = 0; i < 6; i++) {
      var ang = i * Math.PI/3;
      top.push([R*Math.cos(ang), R*Math.sin(ang), h]);
      bot.push([R*Math.cos(ang), R*Math.sin(ang), -h]);
    }
    var edges = [];
    for (var k = 0; k < 6; k++) {
      edges.push([top[k], top[(k+1)%6]]);
      edges.push([bot[k], bot[(k+1)%6]]);
      edges.push([top[k], bot[k]]);
    }
    var mR = R * Math.cos(Math.PI/6);
    var mx = mR * Math.cos(Math.PI/6), my = mR * Math.sin(Math.PI/6);
    return {
      vertices: top.concat(bot), edges: edges, center:[0,0,0], camDist: 4.4,
      shapeName: 'Hexagonal prism', dualName: 'Hexagonal (basal plane rotated 30\u00b0)',
      highSym: [
        {name:'\u0393', pos:[0,0,0], role:'gamma'},
        {name:'M', pos:[mx,my,0], role:'face'},
        {name:'K', pos:[R,0,0], role:'corner'},
        {name:'A', pos:[0,0,h], role:'face'},
        {name:'L', pos:[mx,my,h], role:'edge'},
        {name:'H', pos:top[0], role:'corner'}
      ]
    };
  }

  // ---------- Real-space Wigner-Seitz cells ----------
  // Computed from each lattice's actual nearest-neighbor shell(s), then
  // translated back to the conventional-cell coordinates already on screen.
  // Returns both the cell's wireframe edges and the neighbor positions whose
  // bisector planes actually form those walls (for the translucent overlay).
  function wsFromNeighbors(center, localNeighbors) {
    var verts = voronoiVertices(localNeighbors);
    var edges = minDistanceEdges(verts);
    function T(p){ return [p[0]+center[0], p[1]+center[1], p[2]+center[2]]; }
    return {
      edges: edges.map(function(e){ return [T(e[0]), T(e[1])]; }),
      neighbors: localNeighbors.map(T)
    };
  }

  function wsHexPrism() {
    var r = 1/Math.sqrt(3), h = 1.633/2; // apothem-derived corner radius & half-height
    var top = [], bot = [];
    for (var i = 0; i < 6; i++) {
      var ang = i * Math.PI/3 + Math.PI/6;
      top.push([r*Math.cos(ang), r*Math.sin(ang), h]);
      bot.push([r*Math.cos(ang), r*Math.sin(ang), -h]);
    }
    var edges = [];
    for (var k = 0; k < 6; k++) {
      edges.push([top[k], top[(k+1)%6]]);
      edges.push([bot[k], bot[(k+1)%6]]);
      edges.push([top[k], bot[k]]);
    }
    // the 6 in-plane nearest neighbors (radius 1, z=0) plus the 2 vertical
    // neighbors (0,0,+-1.633) that bound the prism top/bottom
    var neighbors = [];
    for (var j = 0; j < 6; j++) {
      var a2 = j * Math.PI/3;
      neighbors.push([Math.cos(a2), Math.sin(a2), 0]);
    }

    if (key === 'rect') return [['X', h(b1, 0.5), 'face'], ['Y', h(b2, 0.5), 'face'], ['S', h(sum, 0.5), 'edge']];
    if (key === 'hex') return [['M', h(b1, 0.5), 'face'], ['K', [(2*b1[0] - b2[0]) / 3, (2*b1[1] - b2[1]) / 3], 'corner']];
    return [];
  }
  function polyStr(poly, S) {
    return poly.map(function(p){ return (p[0]*S).toFixed(1) + ',' + (-p[1]*S).toFixed(1); }).join(' ');
  }

  function render2D() {
    var key = key2d, v = vecs2D(key), a1 = v[0], a2 = v[1];
    var bb = recipVecs2D(a1, a2), b1 = bb[0], b2 = bb[1];
    var recip = (space2d === 'recip');
    var g1 = recip ? b1 : a1, g2 = recip ? b2 : a2;
    var cell = voronoi2D(g1, g2, 4);
    var S;
    if (recip) {
      var maxR = 0;
      cell.forEach(function(p){ maxR = Math.max(maxR, len2(p)); });
      S = Math.min(150 / maxR, 175 / Math.max(len2(b1), len2(b2)), 260);
    } else {
      S = 62;
    }
    var s = '<svg viewBox="-200 -200 400 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">';
    s += '<defs><marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--primitive)"/></marker>' +
         '<marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--recip-edge)"/></marker></defs>';

    if (recip) {
      s += '<polygon points="' + polyStr(cell, S) + '" style="fill:var(--recip-zone);fill-opacity:0.14;stroke:var(--recip-zone);stroke-width:2.5" stroke-linejoin="round"/>';
    } else {
      if (showWS) {
        s += '<polygon points="' + polyStr(cell, S) + '" style="fill:var(--ws);fill-opacity:0.14;stroke:var(--ws);stroke-width:2.5" stroke-linejoin="round"/>';
      }
      if (showPrimitive) {
        var pc = [[0, 0], a1, add2(a1, a2), a2];
        s += '<polygon points="' + polyStr(pc, S) + '" style="fill:var(--primitive);fill-opacity:0.16;stroke:var(--primitive);stroke-width:2;stroke-dasharray:6 4"/>';
      }
      if (key === 'crect') {
        var cr = P2.crect.r;
        s += '<polygon points="' + polyStr([[0, 0], [1, 0], [1, cr], [0, cr]], S) + '" style="fill:none;stroke:var(--text-dim);stroke-width:1.5;stroke-dasharray:2 4"/>';
      }
    }

    var NN = 9;
    for (var i = -NN; i <= NN; i++) {
      for (var j = -NN; j <= NN; j++) {
        var x = (i*g1[0] + j*g2[0]) * S, y = -(i*g1[1] + j*g2[1]) * S;
        if (Math.abs(x) > 196 || Math.abs(y) > 196) continue;
        if (i === 0 && j === 0) continue;
        s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" style="fill:var(' + (recip ? '--recip-edge' : '--corner') + ')"/>';
      }
    }
    s += '<circle cx="0" cy="0" r="6" style="fill:var(' + (recip ? '--gamma' : '--accent') + ')"/>';

    var arrId = recip ? 'arrB' : 'arrA', arrCol = recip ? '--recip-edge' : '--primitive';
    [g1, g2].forEach(function(g, idx) {
      s += '<line x1="0" y1="0" x2="' + (g[0]*S).toFixed(1) + '" y2="' + (-g[1]*S).toFixed(1) + '" marker-end="url(#' + arrId + ')" style="stroke:var(' + arrCol + ');stroke-width:2.6"/>';
      var L = len2(g), ox = g[0] / L * 14, oy = -g[1] / L * 14;
      s += '<text x="' + (g[0]*S + ox).toFixed(1) + '" y="' + (-g[1]*S + oy + 4).toFixed(1) + '" font-size="16" font-style="italic" font-weight="600" text-anchor="middle" style="fill:var(' + arrCol + ')">' +
           (recip ? 'b' : 'a') + '<tspan dy="4" font-size="11" font-style="normal">' + (idx + 1) + '</tspan></text>';
    });

    if (recip) {
      s += '<text x="9" y="-9" font-size="15" font-weight="700" style="fill:var(--text)">\u0393</text>';
      specialPts2D(key, b1, b2).forEach(function(sp) {
        var px = sp[1][0] * S, py = -sp[1][1] * S;
        s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="5" style="fill:var(' + RECIP_ROLE[sp[2]].color + ')"/>';
        s += '<text x="' + (px + 8).toFixed(1) + '" y="' + (py - 8).toFixed(1) + '" font-size="15" font-weight="700" style="fill:var(--text)">' + sp[0] + '</text>';
      });

    s += '</svg>';
    document.getElementById('view2d').innerHTML = s;

    // description
    var area = Math.abs(a1[0]*a2[1] - a1[1]*a2[0]);
    var gam = Math.acos((a1[0]*a2[0] + a1[1]*a2[1]) / (len2(a1) * len2(a2))) * 180 / Math.PI;
    var cls = classify2D(a1, a2), info = LAT2D[key];
    var html;
    if (!recip) {
      html = '<b>' + info.title + '</b> &mdash; ' + info.blurb +
        '<br><b>a<sub>1</sub></b> = a ' + vs(a1) + ', <b>a<sub>2</sub></b> = a ' + vs(a2) +
        '; &gamma; = ' + gam.toFixed(1) + '&deg;, primitive cell area = ' + pn(area) + ' a&sup2;.';
      if (key === 'crect') html += ' Conventional cell: a &times; b, b/a = ' + P2.crect.r.toFixed(2) + '.';
      if (cls !== info.nominal) html += ' <b>At these parameters the lattice is actually ' + cls + '.</b>';
    } else {
      html = '<b>Reciprocal lattice and first Brillouin zone</b> &mdash; the BZ is the Wigner&ndash;Seitz cell of the reciprocal lattice (' + cell.length + '-sided polygon).' +
        '<br><b>b<sub>1</sub></b> = (2&pi;/a) ' + vs(b1) + ', <b>b<sub>2</sub></b> = (2&pi;/a) ' + vs(b2) +
        ', with b<sub>i</sub>&middot;a<sub>j</sub> = 2&pi;&delta;<sub>ij</sub>. The view is auto-scaled.';
      if (key === 'obl') html += ' Without mirror lines only &Gamma; is a named point; the zone is a general hexagon.';
      if (key === 'crect') html += ' The reciprocal lattice is centered too, so the BZ is a hexagon, not a rectangle.';
      if (cls !== info.nominal) html += ' <b>(The lattice is actually ' + cls + '.)</b>';
    }
    document.getElementById('desc').innerHTML = html;
    var legendEl = document.getElementById('legend');
    legendEl.innerHTML = '';
    function addLeg(swatchHtml, text) {
      var item = document.createElement('div');
      item.className = 'legend-item';

  // ---------- Three.js setup ----------
  var wrap = document.getElementById('canvas-wrap');

  function buildScene(key) {

      });
      var po = data.primitive.origin;
      [data.primitive.a1, data.primitive.a2, data.primitive.a3].forEach(function(pv, pi) {
        var pl = Math.sqrt(pv[0]*pv[0] + pv[1]*pv[1] + pv[2]*pv[2]);
        var pdir = new THREE.Vector3(pv[0]/pl, pv[1]/pl, pv[2]/pl);
        group.add(new THREE.ArrowHelper(pdir, new THREE.Vector3(po[0], po[1], po[2]), pl, new THREE.Color(primColor), 0.14, 0.07));

      var faintMatCache = {};

    Object.keys(LEGEND).forEach(function(t) {

  function buildReciprocalScene(key) {
    var rdata = LATTICES[key].buildRecip();
    current = rdata;

    rdata.edges.forEach(function(e) {
      var geo = new THREE.BufferGeometry().setFromPoints([

    rdata.highSym.forEach(function(pt) {

      }

      mesh.position.set(pt.pos[0], pt.pos[1], pt.pos[2]);

    camera.lookAt(0, 0, 0);

    var pathRow = document.getElementById('pathRow');

        btn.className = 'chip' + (activePath === pathDef.label ? ' active' : '');
        btn.textContent = pathDef.label;
        btn.addEventListener('click', function() {
          activePath = (activePath === pathDef.label) ? null : pathDef.label;
          cursorIdx = 0;

      pathRow.style.display = 'none';
    }

      recipDesc += '<br><b>b<sub>1</sub></b> = (2&pi;/a) ' + RECIP_TXT[key][0] + ', <b>b<sub>2</sub></b> = (2&pi;/a) ' + RECIP_TXT[key][1] +
        ', <b>b<sub>3</sub></b> = (2&pi;/a) ' + RECIP_TXT[key][2] + '.';
    }

        var txt = nm ? nm + ' = ' + activePathDef.pts[ii-1] + '&ndash;' + pt : '';
        if (txt && names.indexOf(txt) < 0) names.push(txt);
      });
      recipDesc += names.length ? names.join(', ') + '. ' : 'zone-boundary segments. ';
      recipDesc += 'Free-electron bands E = &#8463;&sup2;|k+G|&sup2;/2m; drag along the curves to move the marker in the zone.';
    }

    var legendEl = document.getElementById('legend');
    legendEl.innerHTML = '';
    rdata.highSym.forEach(function(pt) {
      var item = document.createElement('div');
      item.className = 'legend-item';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = cssVar(RECIP_ROLE[pt.role].color);
      item.appendChild(dot);
      var txt = document.createElement('span');

      item.appendChild(txt);

  function resize() {

    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', function() { resize(); renderDisp(); });

  // ---------- Interaction: drag to rotate, pinch to zoom ----------
  var autoRotate = true;
  var dragging = false;
  var lastX = 0, lastY = 0;
  var rotX = -0.35, rotY = 0.6;
  var zoom = 1;
  var hintEl = document.getElementById('hint');
  var hintShown = true;

  function hideHint() {
    if (hintShown) { hintEl.style.opacity = '0'; hintShown = false; }
  }

  function pointerDown(x, y) {
    dragging = true;
    lastX = x; lastY = y;
    hideHint();
  }
  function pointerMove(x, y) {
    if (!dragging) return;
    var dx = x - lastX, dy = y - lastY;
    rotY += dx * 0.008;
    rotX += dy * 0.008;
    rotX = Math.max(-1.4, Math.min(1.4, rotX));
    lastX = x; lastY = y;
  }
  function pointerUp() { dragging = false; }

  var dom = renderer.domElement;
  dom.addEventListener('mousedown', function(e){ pointerDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function(e){ pointerMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', pointerUp);

  var pinchDist = null;
  dom.addEventListener('touchstart', function(e){
    if (e.touches.length === 1) {
      pointerDown(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
      dragging = false;
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });
  dom.addEventListener('touchmove', function(e){
    if (e.touches.length === 1) {
      pointerMove(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2 && pinchDist !== null) {
      var d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      var delta = d - pinchDist;
      zoom = Math.max(0.55, Math.min(2.2, zoom + delta * 0.003));
      pinchDist = d;
    }
    e.preventDefault();
  }, { passive: false });
  dom.addEventListener('touchend', function(e){
    if (e.touches.length === 0) { pointerUp(); pinchDist = null; }
  });
  dom.addEventListener('wheel', function(e){
    zoom = Math.max(0.55, Math.min(2.2, zoom + e.deltaY * 0.0015));
    e.preventDefault();
  }, { passive: false });

  // ---------- Controls: chips, rotate toggle, theme ----------
  var chipRow = document.getElementById('chipRow');
  var activeKey = 'fcc';
  var key2d = 'obl';
  var space2d = 'real';
  var activePath; // undefined = default path, null = none, string = label

  function buildChips() {
    var is2d = (viewMode === '2d');
    var dict = is2d ? LAT2D : LATTICES;
    var cur = is2d ? key2d : activeKey;
    chipRow.innerHTML = '';
    Object.keys(dict).forEach(function(key) {
      var chip = document.createElement('button');
      chip.className = 'chip' + (key === cur ? ' active' : '');
      chip.textContent = dict[key].label;
      chip.addEventListener('click', function() {
        Array.prototype.forEach.call(chipRow.children, function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        if (viewMode === '2d') { key2d = key; build2DControls(); }
        else { activeKey = key; }
        activePath = undefined;
        cursorIdx = 0;
        buildScene(activeKey);
      });
      chipRow.appendChild(chip);
    });
  }

  function build2DControls() {
    var sr = document.getElementById('spaceRow');
    sr.innerHTML = '';
    [['real', 'Real space'], ['recip', 'Reciprocal / BZ']].forEach(function(o) {
      var b = document.createElement('button');
      b.className = 'chip' + (space2d === o[0] ? ' active' : '');
      b.textContent = o[1];
      b.addEventListener('click', function() {
        space2d = o[0];
        Array.prototype.forEach.call(sr.children, function(c){ c.classList.remove('active'); });
        b.classList.add('active');
        render2D();
      });
      sr.appendChild(b);
    });
    var box = document.getElementById('sliders');
    box.innerHTML = '';
    (SLIDERS2D[key2d] || []).forEach(function(d) {
      var row = document.createElement('div');
      row.className = 'slider-row';
      var lab = document.createElement('span');
      lab.innerHTML = d.label;
      var inp = document.createElement('input');
      inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.step;
      inp.value = P2[key2d][d.name];
      var val = document.createElement('span');
      val.className = 'val';
      function upd() { val.textContent = d.fmt(P2[key2d][d.name]); }
      inp.addEventListener('input', function() {
        P2[key2d][d.name] = parseFloat(inp.value);
        upd();
        render2D();
      });
      upd();
      row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
      box.appendChild(row);
    });
  }

  buildChips();

  var rotateBtn = document.getElementById('rotateBtn');
  rotateBtn.addEventListener('click', function() {
    autoRotate = !autoRotate;
    rotateBtn.classList.toggle('active', autoRotate);
  });

  var showPrimitive = false;
  var primBtn = document.getElementById('primBtn');
  primBtn.addEventListener('click', function() {
    showPrimitive = !showPrimitive;
    primBtn.classList.toggle('active', showPrimitive);
    buildScene(activeKey);
  });

  var showWS = false;
  var wsBtn = document.getElementById('wsBtn');
  wsBtn.addEventListener('click', function() {
    showWS = !showWS;
    wsBtn.classList.toggle('active', showWS);
    buildScene(activeKey);
  });

  var modeRow = document.getElementById('modeRow');
  var view2d = document.getElementById('view2d');
  var ctl2d = document.getElementById('ctl2d');
  Array.prototype.forEach.call(modeRow.children, function(btn) {
    btn.addEventListener('click', function() {
      Array.prototype.forEach.call(modeRow.children, function(c){ c.classList.remove('active'); });
      btn.classList.add('active');
      viewMode = btn.getAttribute('data-mode');
      var isRec = (viewMode === 'reciprocal'), is2d = (viewMode === '2d');
      primBtn.style.display = isRec ? 'none' : '';
      wsBtn.style.display = isRec ? 'none' : '';
      rotateBtn.style.display = is2d ? 'none' : '';
      renderer.domElement.style.display = is2d ? 'none' : '';
      view2d.style.display = is2d ? 'block' : 'none';
      ctl2d.style.display = is2d ? 'block' : 'none';
      hintEl.style.display = is2d ? 'none' : '';
      if (is2d) document.getElementById('pathRow').style.display = 'none';
      activePath = undefined;
      cursorIdx = 0;
      buildChips();
      if (is2d) build2DControls();
      buildScene(activeKey);
    });
  });

  var themeBtn = document.getElementById('themeBtn');
  var themeState = 'auto';
  themeBtn.addEventListener('click', function() {
    if (themeState === 'auto') { themeState = 'dark'; document.documentElement.setAttribute('data-theme','dark'); themeBtn.innerHTML = '&#9789;'; }
    else if (themeState === 'dark') { themeState = 'light'; document.documentElement.setAttribute('data-theme','light'); themeBtn.innerHTML = '&#9728;'; }
    else { themeState = 'auto'; document.documentElement.removeAttribute('data-theme'); themeBtn.innerHTML = '&#9788;'; }
    buildScene(activeKey);
  });

  // ---------- Animation loop ----------
  function animate() {
    requestAnimationFrame(animate);
    if (viewMode === '2d') return;
    if (autoRotate && !dragging) rotY += 0.0035;
    group.rotation.set(rotX, rotY, 0);
    var baseDist = current ? current.camDist : 3;
    var d = baseDist / zoom;
    camera.position.set(d * 0.85, d * 0.65, d * 0.95);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  }

  resize();
  buildScene(activeKey);
  animate();

  setTimeout(function(){ if (hintShown) hintEl.style.opacity = '0.85'; }, 300);
  setTimeout(hideHint, 4500);
})();
</script>
<script src="../assets/js/course-back.js" defer></script>
