<style>
:root{
  --bg:#f1f3f8; --panel:#ffffff; --ink:#0f1a30; --muted:#586279; --line:#d3d9e6;
  --btn:#0f1a30; --btn-ink:#ffffff; --focus:#1c6fd6; --ans:#eef4ff; --ans-line:#c9d9f5;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1120; --panel:#141c2e; --ink:#eaf0fb; --muted:#9aa7c0; --line:#26314a;
         --btn:#eaf0fb; --btn-ink:#0b1120; --focus:#8bb6ff; --ans:#14233f; --ans-line:#2a4372; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 140px}
.wrap.q{padding-bottom:40px}

.mast .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:12px}
.back{color:var(--muted);font-size:.92rem}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;padding:7px 15px;font-weight:700;letter-spacing:.02em}
.lang button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.mast h1{font:700 clamp(2.4rem,8vw,3.7rem)/1.02 var(--serif);letter-spacing:-.02em}
.mast p{margin:.5rem 0 0;color:var(--muted);max-width:48ch}
.spectrum{height:9px;border-radius:5px;margin:16px 0 26px;background:var(--spectrum)}

.sec{margin:0 0 26px}
.sec>h2{font:600 1rem var(--sans);margin-bottom:10px}
.hint{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:120px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.chip{--c:#888;--ci:#fff;position:relative;text-align:left;padding:10px 12px 10px 14px;border-radius:12px;border:2px solid var(--c);background:var(--panel);display:grid;gap:1px}
.chip .no{font:700 1.5rem/1 var(--serif)}
.chip .nm{font-size:.83rem;line-height:1.25}
.chip .ct{font-size:.78rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--c);color:var(--ci)}
.chip[aria-pressed="true"] .ct{color:inherit;opacity:.85}
.chip[aria-pressed="false"]::after{content:"";position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--c)}
.toolrow{display:flex;gap:10px;margin-top:12px}
.tbtn{background:none;border:0;padding:6px 2px;text-decoration:underline;color:var(--muted)}
details.rules{border:1.5px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px;margin-bottom:26px}
details.rules summary{cursor:pointer;font-weight:600}
details.rules ol{margin:.6rem 0 0;padding-left:1.3rem;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock-in{max-width:728px;margin:0 auto;display:flex;gap:12px;align-items:center}
.dock-in .info{flex:1;color:var(--muted);font-size:.92rem;line-height:1.3}
.btn{border:0;border-radius:12px;padding:14px 22px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:1.05rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}

/* question page */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.homebtn{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 16px}
.progress i{display:block;height:100%;background:var(--btn)}
.qcard{--c:#888;--ci:#fff;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 14px 30px -18px rgba(6,12,28,.5)}
.qcard .stripe{height:10px;background:var(--c)}
.qcard .in{padding:18px 18px 22px}
.qcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:12px}
.qcard .tag{background:var(--c);color:var(--ci);font-weight:700;border-radius:6px;padding:1px 9px}
.qcard .q{font:600 clamp(1.3rem,4.6vw,1.75rem)/1.3 var(--serif);text-wrap:pretty}
.discuss{margin:14px 2px 0;color:var(--muted);font-size:.95rem}
.ans{margin-top:14px;background:var(--ans);border:1.5px solid var(--ans-line);border-left:8px solid var(--c);border-radius:14px;padding:14px 16px}
.ans h3{font:700 .8rem var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ans p{margin:0;font-size:1.04rem;line-height:1.62}
.grow{display:grid;gap:10px;margin-top:16px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.keys{text-align:center;color:var(--muted);font-size:.85rem;margin-top:14px}
kbd{font:inherit;font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
noscript{display:block;padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const DATA = {"chapters":[{"id":"3","short":"Waves and polarization","short_fi":"Aallot ja polarisaatio","color":"#d9480f","ink":"#ffffff"},{"id":"4","short":"Field energy and radiation","short_fi":"Kentän energia ja säteily","color":"#f2b705","ink":"#1b1b1b"},{"id":"5","short":"Light–matter and lasing","short_fi":"Valo–aine ja laser","color":"#7cb518","ink":"#1b1b1b"},{"id":"6","short":"Reflection and refraction","short_fi":"Heijastus ja taittuminen","color":"#1e8a3e","ink":"#ffffff"},{"id":"7","short":"Fourier and coherence","short_fi":"Fourier ja koherenssi","color":"#0a8490","ink":"#ffffff"},{"id":"8","short":"Interference","short_fi":"Interferenssi","color":"#1c6fd6","ink":"#ffffff"},{"id":"9","short":"Diffraction","short_fi":"Diffraktio","color":"#4f46c8","ink":"#ffffff"},{"id":"10","short":"Geometrical optics","short_fi":"Geometrinen optiikka","color":"#8e3fc8","ink":"#ffffff"}],"questions":[{"id":1,"ch":"3","q":{"fi":"Selitä lyhyesti millainen aalto on aikaharmoninen tasoaalto.","en":"Briefly explain what is a time-harmonic plane wave."},"a":{"en":"A time-harmonic plane wave oscillates sinusoidally in time at a single angular frequency ω, so its field can be written as E = E₀ cos(k·r − ωt + φ), or in complex form E₀ exp[i(k·r − ωt)]. Its wavefronts, the surfaces of constant phase, are infinite planes perpendicular to the wave vector k, and the amplitude is the same everywhere on them. The wave travels in the direction of k with phase velocity v = ω/k, and its wavelength is λ = 2π/k. It is an idealisation, but any more complicated wave can be built as a superposition of such waves.","fi":"Aikaharmoninen tasoaalto värähtelee ajan suhteen siniaaltona yhdellä kulmataajuudella ω, joten kenttä voidaan kirjoittaa muodossa E = E₀ cos(k·r − ωt + φ) tai kompleksimuodossa E₀ exp[i(k·r − ωt)]. Sen aaltorintamat eli vakiovaiheen pinnat ovat äärettömiä tasoja, jotka ovat kohtisuorassa aaltovektoria k vastaan, ja amplitudi on sama kaikkialla näillä tasoilla. Aalto etenee k:n suuntaan vaihenopeudella v = ω/k, ja sen aallonpituus on λ = 2π/k. Tasoaalto on idealisaatio, mutta mikä tahansa monimutkaisempi aalto voidaan rakentaa tällaisten aaltojen superpositiona."}},{"id":2,"ch":"3","q":{"fi":"Selitä lyhyesti mitä optiikassa tarkoitetaan superpositioperiaatteella.","en":"Briefly explain what is meant by the superposition principle in optics."},"a":{"en":"The superposition principle states that when several waves are present at the same place, the resulting field is the sum of the individual fields. It holds because the wave equation (and Maxwell's equations in vacuum and in linear media) is linear, so a sum of solutions is also a solution. Waves therefore pass through each other without changing one another, and their fields add with the correct phases. This is the basis of interference, diffraction and the Fourier analysis of light.","fi":"Superpositioperiaatteen mukaan, kun useita aaltoja on samassa paikassa, kokonaiskenttä on yksittäisten kenttien summa. Periaate pätee, koska aaltoyhtälö (sekä Maxwellin yhtälöt tyhjiössä ja lineaarisessa aineessa) on lineaarinen, jolloin ratkaisujen summa on myös ratkaisu. Aallot siis kulkevat toistensa lävitse muuttamatta toisiaan, ja niiden kentät summautuvat vaihe huomioiden. Tämä on interferenssin, diffraktion ja valon Fourier-analyysin perusta."}},{"id":3,"ch":"3","q":{"fi":"Selitä lyhyesti mitä tarkoittaa aaltorintama.","en":"Briefly explain what is a wavefront."},"a":{"en":"A wavefront is a surface on which the phase of the wave has the same value at a given instant, for example all the points of a crest. For a plane wave the wavefronts are planes, and for a point source in a homogeneous medium they are spheres. Wavefronts are perpendicular to the local wave vector, so the rays that show the direction of propagation are perpendicular to them. As the wave propagates, the wavefronts move forward with the phase velocity.","fi":"Aaltorintama on pinta, jonka kaikissa pisteissä aallon vaihe on samalla hetkellä sama, esimerkiksi aallonharjan pisteet. Tasoaallon aaltorintamat ovat tasoja ja pistelähteen aaltorintamat homogeenisessa väliaineessa palloja. Aaltorintamat ovat kohtisuorassa paikallista aaltovektoria vastaan, joten etenemissuuntaa kuvaavat säteet ovat kohtisuorassa niitä vastaan. Aallon edetessä aaltorintamat siirtyvät eteenpäin vaihenopeudella."}},{"id":4,"ch":"3","q":{"fi":"Selitä lyhyesti millaisia aaltoja ovat palloaallot. Mainitse joku esimerkki missä aallon etenemistä on järkevä kuvata palloaaltojen avulla.","en":"Briefly explain what spherical waves are. Mention an example where it is reasonable to describe wave propagation using spherical waves."},"a":{"en":"Spherical waves spread out in all directions from a point-like source, so their wavefronts are concentric spheres centred on the source. The amplitude of the field falls as 1/r, so the irradiance falls as 1/r² and the total power through any sphere around the source stays constant. An example is the light emitted by a small point-like source such as a single atom or a tiny pinhole. Spherical waves are also used in the Huygens–Fresnel description of diffraction, where every point of an aperture is treated as a source of spherical wavelets.","fi":"Palloaallot leviävät kaikkiin suuntiin pistemäisestä lähteestä, joten niiden aaltorintamat ovat lähteen ympärillä olevia samankeskisiä palloja. Kentän amplitudi pienenee kuten 1/r, joten irradianssi pienenee kuten 1/r² ja lähteen ympäröivän pallon läpi kulkeva kokonaisteho pysyy vakiona. Esimerkki on pienen pistemäisen lähteen, kuten yksittäisen atomin tai pienen aukon, lähettämä valo. Palloaaltoja käytetään myös Huygensin–Fresnelin periaatteessa, jossa aukon jokaista pistettä kuvataan palloaaltojen lähteenä."}},{"id":5,"ch":"4","q":{"fi":"Selitä muutamalla lauseella mitä tarkoittaa valon säteilypaine, ja mainitse joku esimerkkitilanne missä ilmiö on merkittävä.","en":"In a few sentences, explain what is meant by the radiation pressure of light, and mention a situation where this phenomenon is significant."},"a":{"en":"Light carries momentum, and when it is absorbed or reflected by an object the momentum is transferred to the object. This gives a force per unit area called radiation pressure: at normal incidence it is p = I/c for a perfectly absorbing surface (I is the irradiance) and twice as large, 2I/c, for a perfectly reflecting one. Because c is large, the pressure is tiny in everyday life, but it matters when other forces are small or the irradiance is very high. Examples are solar sails in space and optical tweezers, where a tightly focused laser beam traps and moves microscopic particles (Nobel Prize in Physics 2018, Ashkin).","fi":"Valolla on liikemäärä, ja kun valo absorboituu tai heijastuu kappaleesta, liikemäärä siirtyy kappaleeseen. Tämä aiheuttaa pinta-alayksikköä kohti voiman, jota kutsutaan säteilypaineeksi: kohtisuoralla tulolla täysin absorboivalle pinnalle paine on p = I/c (I on irradianssi) ja täysin heijastavalle kaksinkertainen, 2I/c. Paine on arjessa mitätön, koska c on suuri, mutta se on merkittävä, kun muut voimat ovat pieniä tai irradianssi on erittäin suuri. Esimerkkejä ovat aurinkopurjeet avaruudessa ja optinen pinsetti, jossa tarkennettu lasersäde pidättelee ja liikuttaa mikroskooppisia hiukkasia (Nobelin fysiikanpalkinto 2018, Ashkin)."}},{"id":6,"ch":"4","q":{"fi":"Selitä lyhyesti mikä on Poyntingin vektori. Kuinka Poyntingin vektori liittyy valon irradianssiin?","en":"Briefly explain what the Poynting vector is. How is the Poynting vector related to the irradiance of light?"},"a":{"en":"The Poynting vector S = E × H describes the flow of electromagnetic energy: it points in the direction of energy propagation, and its magnitude is the power per unit area through a surface perpendicular to it (W/m²). For a plane wave it is parallel to the wave vector k. The irradiance I of light is the time average of the magnitude of the Poynting vector, I = <|S|>. For a harmonic wave this gives I = ½ n ε₀ c E₀², so the irradiance is proportional to the square of the field amplitude. Detectors measure this time average, because the instantaneous S oscillates far too fast to follow.","fi":"Poyntingin vektori S = E × H kuvaa sähkömagneettisen energian virtausta: se osoittaa energian etenemissuuntaan ja sen suuruus on pinta-alayksikön läpi kulkeva teho (W/m²). Tasoaallolle se on aaltovektorin k suuntainen. Valon irradianssi I on Poyntingin vektorin itseisarvon aikakeskiarvo, I = <|S|>. Harmoniselle aallolle saadaan I = ½ n ε₀ c E₀², eli irradianssi on verrannollinen kenttäamplitudin neliöön. Ilmaisimet mittaavat tätä aikakeskiarvoa, koska hetkellinen S värähtelee aivan liian nopeasti."}},{"id":7,"ch":"4","q":{"fi":"Selitä muutamalla lauseella mitä tarkoitetaan valon kokemalla optisella matkalla.","en":"In a few sentences, explain what is meant by the optical path length experienced by light."},"a":{"en":"The optical path length is the geometric distance travelled by light multiplied by the refractive index of the medium, OPL = n d, or ∫ n ds if the index varies along the path. It equals the distance light would travel in vacuum during the same time, because its speed in the medium is c/n. The phase accumulated by a wave is 2π·OPL/λ₀, where λ₀ is the vacuum wavelength, so the optical path difference between two routes decides whether they interfere constructively or destructively. Fermat's principle is also formulated with it: light follows paths along which the optical path length is stationary.","fi":"Optinen matka on valon kulkema geometrinen matka kerrottuna väliaineen taitekertoimella, OPL = n d, tai ∫ n ds, jos taitekerroin vaihtelee reitillä. Se on yhtä suuri kuin matka, jonka valo kulkisi tyhjiössä samassa ajassa, koska valon nopeus väliaineessa on c/n. Aallon kerrytämä vaihe on 2π·OPL/λ₀, missä λ₀ on tyhjiön aallonpituus, joten kahden reitin optinen matkaero ratkaisee, interferoivatko ne konstruktiivisesti vai destruktiivisesti. Myös Fermat'n periaate muotoillaan optisen matkan avulla: valo kulkee reittiä, jolla optinen matka on stationaarinen."}},{"id":8,"ch":"5","q":{"fi":"Selitä muutamalla lauseella mikä on Lorentzin atomimalli. Kerro kuinka malli liittyy taitekertoimien dispersiivisyyteen.","en":"In a few sentences, explain what the Lorentz atomic model is. Explain how the model relates to the dispersive properties of refractive indices."},"a":{"en":"In the Lorentz model an atom or molecule is treated classically: a bound electron is a damped harmonic oscillator with a resonance frequency ω₀, driven by the oscillating electric field of the light. The driven electron forms an oscillating dipole whose amplitude and phase depend on the driving frequency, and the sum of these dipoles gives the polarization of the material. This makes the permittivity, and thus the refractive index, depend on frequency: n(ω) is determined by how close ω is to the resonance frequencies. The model therefore explains dispersion, and also why absorption is strong close to a resonance.","fi":"Lorentzin atomimallissa atomia tai molekyyliä kuvataan klassisesti: sidottu elektroni on vaimennettu harmoninen oskillaattori, jonka resonanssitaajuus on ω₀ ja jota valon värähtelevä sähkökenttä pakottaa. Pakotettu elektroni muodostaa värähtelevän dipolin, jonka amplitudi ja vaihe riippuvat valon taajuudesta, ja dipolien summa muodostaa aineen polarisaation. Siksi permittiivisyys ja taitekerroin riippuvat taajuudesta: n(ω) määräytyy sen mukaan, kuinka lähellä ω on aineen resonanssitaajuuksia. Malli selittää näin dispersion sekä sen, miksi absorptio on voimakasta resonanssien lähellä."}},{"id":9,"ch":"5","q":{"fi":"Selitä lyhyesti mitä ovat aineen normaali ja anomaalinen dispersio.","en":"Briefly explain what normal and anomalous dispersion of a material are."},"a":{"en":"In normal dispersion the refractive index increases with frequency (it decreases with increasing wavelength), dn/dω > 0. This is the usual situation for transparent materials in the visible range, away from resonances, and it is why blue light is refracted more than red light in a prism. In anomalous dispersion the index decreases with increasing frequency, dn/dω < 0. It occurs close to an absorption resonance, where the material also absorbs strongly, so it is observed only in narrow spectral regions around absorption lines.","fi":"Normaalissa dispersiossa taitekerroin kasvaa taajuuden kasvaessa (pienenee aallonpituuden kasvaessa), eli dn/dω > 0. Tämä on tavallista läpinäkyville aineille näkyvällä alueella, kaukana resonansseista, ja siksi sininen valo taittuu prismassa enemmän kuin punainen. Anomaalisessa dispersiossa taitekerroin pienenee taajuuden kasvaessa, dn/dω < 0. Sitä esiintyy absorptioresonanssin lähellä, missä aine myös absorboi voimakkaasti, joten se havaitaan vain kapeilla spektrialueilla absorptioviivojen ympärillä."}},{"id":10,"ch":"5","q":{"fi":"Kerro lyhyesti millaisia sironta/absorptio-prosesseja voi tapahtua kun valo vuorovaikuttaa aineen kanssa.","en":"Briefly describe what types of scattering/absorption processes can occur when light interacts with matter."},"a":{"en":"In absorption the energy of a photon is taken up by the material, for example by exciting an electron to a higher energy level, and the energy ends up as heat or is re-emitted later, as in fluorescence and phosphorescence. In scattering the light drives the charges of the material, which re-radiate it in other directions at the same frequency, and the strength depends on the size of the scatterers. Rayleigh scattering by particles much smaller than the wavelength is stronger for short wavelengths (∝ 1/λ⁴), which makes the sky blue. Both processes attenuate a beam that passes through matter.","fi":"Absorptiossa fotonin energia siirtyy aineelle, esimerkiksi viristämällä elektroni korkeammalle energiatasolle, ja energia päätyy lämmöksi tai säteilee myöhemmin uudelleen, kuten fluoresenssissa ja fosforesenssissa. Sironnassa valo pakottaa aineen varaukset värähtelemään, ja ne säteilevät valon uudelleen muihin suuntiin samalla taajuudella; sironnan voimakkuus riippuu sirottajien koosta. Rayleigh-sironta, jossa hiukkaset ovat paljon aallonpituutta pienempiä, on sitä voimakkaampaa mitä lyhyempi aallonpituus on (∝ 1/λ⁴), mikä tekee taivaasta sinisen. Molemmat prosessit vaimentavat aineen läpi kulkevaa valokeilaa."}},{"id":11,"ch":"6","q":{"fi":"Selitä muutamalla lauseella mitä tarkoittaa valon kokonaisheijastuminen, ja missä tilanteessa valo voi kokonaisheijastua. Mainitse myös yksi ilmiötä hyödyntävä sovelluskohde.","en":"In a few sentences, explain what total internal reflection is and in what situations light can undergo total internal reflection. Also, mention one application that utilizes this phenomenon."},"a":{"en":"Total internal reflection means that all of the light is reflected at an interface instead of being refracted into the second medium. It occurs when light travels from an optically denser medium (refractive index n₁) towards an optically less dense one (n₂ < n₁) and the angle of incidence exceeds the critical angle θc = arcsin(n₂/n₁). Beyond θc Snell's law has no real solution for the refraction angle, and only an evanescent wave remains in the second medium. An application is the optical fibre, where light is guided in the high-index core by repeated total internal reflection at the core–cladding boundary; reflecting prisms in binoculars are another.","fi":"Kokonaisheijastuksessa kaikki valo heijastuu rajapinnasta eikä taitu toiseen väliaineeseen. Se tapahtuu, kun valo etenee optisesti tiheämmästä väliaineesta (taitekerroin n₁) optisesti harvempaan (n₂ < n₁) ja tulokulma on suurempi kuin kriittinen kulma θc = arcsin(n₂/n₁). Tällöin Snellin laki ei anna taitekulmalle reaalista ratkaisua, ja toiseen väliaineeseen jää vain evanescentti aalto. Sovelluskohde on optinen kuitu, jossa valo kulkee suuren taitekertoimen ytimessä toistuvasti kokonaisheijastuen ytimen ja vaipan rajapinnasta; toinen on kiikarien heijastavat prismat."}},{"id":12,"ch":"6","q":{"fi":"Selitä muutamalla lauseella mitä ovat Fresnelin kertoimet. Selitä mitä tapahtuu heijastuneelle valolle, jos Fresnelin heijastuskerroin (kentän amplitudille) on kompleksiarvoinen suure.","en":"In a few sentences, explain what Fresnel coefficients are. Explain what happens to reflected light if the Fresnel reflection coefficient (for field amplitude) is a complex quantity."},"a":{"en":"The Fresnel coefficients give the ratios of the reflected and transmitted field amplitudes to the incident amplitude when light meets an interface between two media. They depend on the refractive indices, the angle of incidence and the polarization (s or p), and the reflectance and transmittance for power follow from them. If the reflection coefficient is real, the reflected wave is either in phase with the incident wave or shifted by π, depending on its sign. If it is complex, the reflected wave also gets a phase shift equal to the argument of the coefficient, as in total internal reflection, where the magnitude is 1 and only the phase changes (differently for s and p).","fi":"Fresnelin kertoimet kertovat, kuinka suuri osa tulevan aallon kenttäamplitudista heijastuu ja läpäisee rajapinnan kahden väliaineen välillä. Ne riippuvat taitekertoimista, tulokulmasta ja polarisaatiosta (s tai p), ja niistä saadaan myös tehon heijastus- ja läpäisykertoimet. Jos heijastuskerroin on reaalinen, heijastunut aalto on samassa vaiheessa tulevan kanssa tai π:n vaihesiirrossa kertoimen merkistä riippuen. Jos kerroin on kompleksinen, heijastuneelle aallolle tulee lisäksi vaihesiirto, joka on kertoimen argumentti; näin käy kokonaisheijastuksessa, jossa kertoimen itseisarvo on 1 ja vain vaihe muuttuu (eri tavalla s- ja p-polarisaatiolle)."}},{"id":13,"ch":"6","q":{"fi":"Selitä muutamalla lauseella mikä on Brewsterin kulma. Mainitse myös yksi ilmiötä hyödyntävä sovelluskohde.","en":"In a few sentences, explain what the Brewster's angle is. Mention one application that utilizes this phenomenon."},"a":{"en":"Brewster's angle θB is the angle of incidence at which light polarized in the plane of incidence (p-polarized) is not reflected at all, i.e. the p reflection coefficient is zero. It is given by tan θB = n₂/n₁, and at this angle the reflected and refracted rays are perpendicular to each other. If unpolarized light is incident at θB, the reflected light is purely s-polarized (linearly polarized perpendicular to the plane of incidence). Applications are Brewster windows and Brewster-cut gain crystals in laser cavities, which transmit p-polarized light without reflection loss and give a linearly polarized output.","fi":"Brewsterin kulma θB on tulokulma, jolla tulotason suuntaan polarisoitu (p-polarisoitu) valo ei heijastu lainkaan, eli p-polarisaation heijastuskerroin on nolla. Se saadaan ehdosta tan θB = n₂/n₁, ja tällä kulmalla heijastunut ja taittunut säde ovat kohtisuorassa toisiaan vastaan. Jos polarisoimaton valo tulee kulmassa θB, heijastunut valo on kokonaan s-polarisoitua (tulotasoa vastaan kohtisuoraan lineaarisesti polarisoitua). Sovelluksia ovat laserkaviteettien Brewster-ikkunat ja Brewster-kulmaan leikatut vahvistuskiteet, jotka päästävät p-polarisoidun valon läpi ilman heijastushäviötä ja tuottavat lineaarisesti polarisoidun valon."}},{"id":14,"ch":"6","q":{"fi":"Kerro lyhyesti mitä tarkoitetaan termillä tulotaso.","en":"Briefly explain what is meant by the term plane of incidence."},"a":{"en":"The plane of incidence is the plane that contains the incident ray (or the wave vector of the incident wave) and the normal of the surface at the point of incidence. The reflected and refracted rays lie in the same plane. The angles of incidence, reflection and refraction are measured in it. It also defines the polarization components: p-polarized light has its electric field in the plane of incidence and s-polarized light perpendicular to it.","fi":"Tulotaso on taso, joka sisältää tulevan säteen (tai tulevan aallon aaltovektorin) ja pinnan normaalin tulopisteessä. Heijastunut ja taittunut säde ovat samassa tasossa. Tulo-, heijastus- ja taitekulma mitataan tässä tasossa. Se määrittelee myös polarisaatiokomponentit: p-polarisoidun valon sähkökenttä on tulotasossa ja s-polarisoidun sitä vastaan kohtisuorassa."}},{"id":15,"ch":"7","q":{"fi":"Selitä muutamalla lauseella millainen on seisova aalto. Mainitse myös missä sellaisia aaltoja voidaan havaita.","en":"In a few sentences, explain what a standing wave is. Explain also where such waves are encountered."},"a":{"en":"A standing wave forms when two waves of the same frequency travel in opposite directions and superpose, for example an incident wave and its reflection. Its amplitude varies with position (for example as 2A|cos kx|), with nodes where the field is always zero and antinodes where the oscillation is strongest, and the pattern does not propagate. Standing waves appear in resonators, where boundary conditions allow only certain frequencies: vibrating strings, the air columns of organ pipes and flutes, and light between the mirrors of a laser cavity or a Fabry–Pérot resonator.","fi":"Seisova aalto syntyy, kun kaksi samantaajuista aaltoa etenee vastakkaisiin suuntiin ja summautuu, esimerkiksi tuleva aalto ja sen heijastus. Sen amplitudi vaihtelee paikan funktiona (esimerkiksi 2A|cos kx|), jolloin kentällä on solmukohtia, joissa se on aina nolla, ja vatsoja, joissa värähtely on voimakkainta, eikä kuvio etene. Seisovia aaltoja syntyy resonaattoreissa, joissa reunaehdot sallivat vain tietyt taajuudet: värähtelevät kielet, urkupillien ja huilujen ilmapatsaat sekä valo laserin kaviteetissa tai Fabry–Perot-resonaattorissa peilien välissä."}},{"id":16,"ch":"7","q":{"fi":"Selitä lyhyesti mitä tarkoitetaan signaalin Fourier-analyysillä.","en":"Explain briefly what is meant by the Fourier analysis of a signal."},"a":{"en":"Fourier analysis means decomposing a signal into a sum (or integral) of sinusoidal components with different frequencies, amplitudes and phases. For a periodic signal the result is a Fourier series with discrete harmonic frequencies, and for a non-periodic signal such as a pulse it is a Fourier transform with a continuous spectrum. The result tells how much of each frequency the signal contains; the power spectrum is the squared magnitude of this. In optics the spectrum of a light source or of a pulse is determined this way.","fi":"Fourier-analyysissä signaali hajotetaan summaksi (tai integraaliksi) eritaajuisia siniaaltoja, joilla on omat amplitudinsa ja vaiheensa. Jaksolliselle signaalille tuloksena on Fourier-sarja, jossa on erilliset harmoniset taajuudet, ja ei-jaksolliselle signaalille, kuten pulssille, Fourier-muunnos, jolla on jatkuva spektri. Tulos kertoo, kuinka paljon kutakin taajuutta signaalissa on; tehospektri on tämän itseisarvon neliö. Optiikassa valonlähteen tai pulssin spektri määritetään tällä tavalla."}},{"id":17,"ch":"7","q":{"fi":"Selitä lyhyesti mitä tarkoitetaan signaalin Fourierin synteesillä.","en":"Explain briefly what is meant by the Fourier synthesis of a signal."},"a":{"en":"Fourier synthesis is the opposite process: a signal is built by adding together sinusoidal waves whose frequencies, amplitudes and phases have been chosen. Adding the harmonics of a fundamental frequency with suitable weights gives a periodic waveform such as a square or sawtooth wave, and the more terms are included, the closer the sum is to the target signal. In the continuous case this is the inverse Fourier transform. In optics it explains how a short light pulse is formed from many frequencies with suitable phases, and the broader the spectrum, the shorter the pulse can be.","fi":"Fourier-synteesi on käänteinen toimenpide: signaali rakennetaan laskemalla yhteen siniaaltoja, joiden taajuudet, amplitudit ja vaiheet on valittu. Kun perustaajuuden harmoniset lasketaan yhteen sopivilla painoilla, saadaan jaksollinen aaltomuoto, kuten kanttiaalto tai sahalaita-aalto, ja mitä enemmän termejä otetaan mukaan, sitä tarkemmin summa vastaa tavoiteltua signaalia. Jatkuvassa tapauksessa kyse on käänteisestä Fourier-muunnoksesta. Optiikassa tämä selittää, kuinka lyhyt valopulssi muodostuu monesta sopivavaiheisesta taajuudesta, ja mitä laajempi spektri on, sitä lyhyempi pulssi on mahdollinen."}},{"id":18,"ch":"8","q":{"fi":"Selitä muutamalla lauseella millainen on ohutkalvorakenne. Kerro yksi optiikan sovelluskohde missä ohutkalvoja hyödynnetään.","en":"In a few sentences, explain what a thin film structure is. Mention one optical application where thin films are utilized."},"a":{"en":"A thin film structure is a layer, or a stack of layers of different materials, whose thickness is comparable to the wavelength of light, typically tens to hundreds of nanometres. Light reflected from the top and bottom surfaces of each layer interferes, so by choosing the thicknesses and refractive indices the structure can be designed to be highly reflecting or highly transmitting at chosen wavelengths. Applications include antireflection coatings on lenses and glasses, dielectric mirrors in lasers, and interference filters.","fi":"Ohutkalvorakenne on kerros tai pino eri aineista tehtyjä kerroksia, joiden paksuus on aallonpituuden suuruusluokkaa, tyypillisesti kymmenistä satoihin nanometreihin. Kunkin kerroksen ylä- ja alapinnasta heijastuneet valot interferoivat, joten paksuuksia ja taitekertoimia valitsemalla rakenne voidaan suunnitella heijastamaan tai läpäisemään erittäin hyvin valittuja aallonpituuksia. Sovelluksia ovat linssien ja lasien heijastuksenestopinnoitteet, laserien dielektriset peilit ja interferenssisuotimet."}},{"id":19,"ch":"8","q":{"fi":"Selitä muutamalla lauseella millainen instrumentti on Michelsonin interferometri. Mainitse myös joku Michelsonin interferometrin sovelluskohde.","en":"In a few sentences, explain what a Michelson interferometer is. Mention one application of the Michelson interferometer."},"a":{"en":"A Michelson interferometer is an amplitude-splitting interferometer: a beam splitter divides the light into two arms, each beam is reflected back by a mirror, and the beams are recombined at the beam splitter. The interference pattern at the output depends on the optical path difference between the arms, so moving one mirror by λ/2 shifts the pattern by one fringe. The instrument therefore measures tiny distances or changes of refractive index, and with a broadband source it can be used to measure the coherence length. Applications are Fourier-transform spectroscopy and the detection of gravitational waves in LIGO.","fi":"Michelsonin interferometri on amplitudin jakava interferometri: säteenjakaja jakaa valon kahteen haaraan, kumpikin säde heijastuu takaisin peilistä ja säteet yhdistetään uudelleen säteenjakajassa. Ulostulon interferenssikuvio riippuu haarojen optisesta matkaerosta, joten peilin siirtäminen matkan λ/2 verran siirtää kuviota yhden raidan. Siksi laite mittaa pieniä etäisyyksiä tai taitekertoimen muutoksia, ja laajakaistaisella lähteellä sillä voidaan mitata koherenssipituus. Sovelluksia ovat Fourier-spektroskopia ja gravitaatioaaltojen havaitseminen LIGO-observatoriossa."}},{"id":20,"ch":"8","q":{"fi":"Selitä millainen laite on Fabry–Pérot interferometri, ja mainitse yksi kyseisen interferometrin sovelluskohteista.","en":"Explain what a Fabry–Pérot interferometer is, and mention one application of this interferometer."},"a":{"en":"A Fabry–Pérot interferometer consists of two parallel, partially reflecting mirrors a distance d apart (an etalon if the mirrors are the surfaces of a plate). Light bounces back and forth between the mirrors, and the multiple transmitted beams interfere with each other. The transmission is high only at resonance wavelengths, where 2nd cos θ = mλ, which gives narrow transmission peaks whose sharpness (finesse) grows with the mirror reflectivity. It is therefore used as a high-resolution spectrometer or a narrow-band filter, and with a gain medium inside it forms a laser cavity.","fi":"Fabry–Perot-interferometri koostuu kahdesta yhdensuuntaisesta, osittain heijastavasta peilistä, joiden etäisyys on d (etalon, jos peilit ovat levyn pintoja). Valo heijastuu edestakaisin peilien välillä, ja läpi tulevat monet säteet interferoivat keskenään. Läpäisy on suuri vain resonanssiaallonpituuksilla, joilla 2nd cos θ = mλ, jolloin syntyy kapeita läpäisyhuippuja, joiden terävyys (finesse) kasvaa peilien heijastavuuden mukana. Siksi sitä käytetään korkean erotuskyvyn spektrometrinä tai kapeakaistaisena suotimena, ja vahvistavan aineen kanssa se muodostaa laserkaviteetin."}},{"id":21,"ch":"9","q":{"fi":"Selitä muutamalla lauseella mikä on diffraktiohila. Mainitse yksi optinen instrumentti mikä hyödyntää diffraktiohiloja toiminnassaan.","en":"In a few sentences, explain what a diffraction grating is. Mention one optical instrument that uses diffraction gratings in its operation."},"a":{"en":"A diffraction grating is a periodic structure, for example many parallel slits or grooves with spacing d, that diffracts light. Waves from the different slits interfere constructively in the directions that satisfy the grating equation d sin θ = mλ, where m is the diffraction order. Because the angle depends on the wavelength, a grating separates the colours of light, and the more lines it has, the sharper the maxima and the better the resolving power. An instrument that uses a grating is the spectrometer (or monochromator), which is used to measure spectra.","fi":"Diffraktiohila on jaksollinen rakenne, esimerkiksi monta yhdensuuntaista rakoa tai uraa välimatkan d päässä toisistaan, joka diffraktoi valoa. Eri raoista tulevat aallot interferoivat konstruktiivisesti suunnissa, jotka toteuttavat hilayhtälön d sin θ = mλ, missä m on kertaluku. Koska kulma riippuu aallonpituudesta, hila erottelee valon värit, ja mitä enemmän viivoja hilassa on, sitä terävämmät maksimit ja parempi erotuskyky saadaan. Diffraktiohilaa käyttävä instrumentti on spektrometri (tai monokromaattori), jolla mitataan spektrejä."}},{"id":22,"ch":"9","q":{"fi":"Kerro lyhyesti mitä on Fraunhoferin diffraktio.","en":"Briefly explain what Fraunhofer diffraction is."},"a":{"en":"Fraunhofer diffraction is far-field diffraction, where the source and the observation screen are so far from the aperture that the incoming and outgoing waves can be treated as plane waves. The condition is roughly that the distance z is much larger than a²/λ, where a is the size of the aperture (the Fresnel number a²/(λz) is much smaller than 1). In this limit the diffraction pattern is the Fourier transform of the aperture function, which gives simple patterns such as the sinc² pattern of a single slit. The same pattern is seen in the focal plane of a lens.","fi":"Fraunhoferin diffraktio on kaukokentän diffraktiota, jossa lähde ja varjostin ovat niin kaukana aukosta, että tuleva ja lähtevä aalto voidaan käsitellä tasoaaltoina. Ehto on suunnilleen, että etäisyys z on paljon suurempi kuin a²/λ, missä a on aukon koko (Fresnelin luku a²/(λz) on paljon pienempi kuin 1). Tällöin diffraktiokuvio on aukkofunktion Fourier-muunnos, mikä antaa yksinkertaisia kuvioita, kuten yhden raon sinc²-kuvion. Sama kuvio nähdään myös linssin polttotasossa."}},{"id":23,"ch":"9","q":{"fi":"Kerro lyhyesti mitä on Fresnelin diffraktio.","en":"Briefly explain what Fresnel diffraction is."},"a":{"en":"Fresnel diffraction is near-field diffraction, where the source or the screen is close to the aperture, so the wavefronts are curved and the plane-wave approximation fails. The condition is roughly that the Fresnel number a²/(λz) is about 1 or larger. The pattern then depends strongly on the distance and changes shape as the screen is moved; examples are the bright and dark fringes at an edge and the bright Poisson spot behind a round obstacle. It is calculated with the Huygens–Fresnel principle using a quadratic approximation of the phase.","fi":"Fresnelin diffraktio on lähikentän diffraktiota, jossa lähde tai varjostin on lähellä aukkoa, joten aaltorintamat ovat kaarevia eikä tasoaaltoapproksimaatio päde. Ehto on suunnilleen, että Fresnelin luku a²/(λz) on noin 1 tai suurempi. Kuvio riippuu tällöin voimakkaasti etäisyydestä ja muuttaa muotoaan, kun varjostinta siirretään; esimerkkejä ovat reunan kirkkaat ja tummat raidat sekä pyöreän esteen takana näkyvä kirkas Poissonin piste. Se lasketaan Huygensin–Fresnelin periaatteella käyttäen vaiheen neliöllistä approksimaatiota."}},{"id":24,"ch":"10","q":{"fi":"Selitä muutamalla lauseella kuinka prisma toimii (kaksi erilaista käyttötapaa). Mainitse myös yksi optinen instrumentti, joka hyödyntää prismoja.","en":"In a few sentences, explain how a prism works (two different uses). Mention one optical instrument that utilizes prisms."},"a":{"en":"A prism has two uses. First, because the refractive index depends on the wavelength, the light is refracted by different amounts at the surfaces, so a dispersing prism separates white light into its colours (blue is deviated more than red) and works as a spectrometer. Second, a reflecting prism uses total internal reflection at its faces to turn a beam by 90° or 180°, or to invert or flip an image, without dispersing the colours. Binoculars use Porro (or roof) prisms to turn the image upright and to fold the optical path.","fi":"Prismalla on kaksi käyttötapaa. Ensinnäkin, koska taitekerroin riippuu aallonpituudesta, valo taittuu eri tavoin prisman pinnoilla, joten dispersoiva prisma hajottaa valkoisen valon väreiksi (sininen poikkeaa enemmän kuin punainen) ja toimii spektrometrinä. Toiseksi heijastava prisma käyttää kokonaisheijastusta pinnoillaan kääntääkseen säteen suuntaa 90° tai 180° tai kääntääkseen kuvan ilman värien hajoamista. Kiikareissa käytetään Porro- tai kattoprismoja kuvan kääntämiseen oikein päin ja optisen reitin taittamiseen."}},{"id":25,"ch":"10","q":{"fi":"Selitä muutamalla lauseella mikä on okulaari, ja mihin sitä käytetään. Kerro myös minne ja millaisen kuvan okulaari muodostaa.","en":"In a few sentences, explain what an eyepiece is and what it is used for. Also, explain where and what type of image the eyepiece forms."},"a":{"en":"An eyepiece (ocular) is the lens or lens group closest to the eye in an optical instrument such as a microscope or a telescope. It works as a magnifying glass for the real intermediate image formed by the objective, and it increases the angle under which the observer sees this image. In most designs the intermediate image lies at the focal point of the eyepiece, so the eyepiece forms a virtual, enlarged image at infinity, meaning that the rays leaving the eyepiece are parallel to each other. This allows the image to be viewed with a relaxed eye focused at infinity.","fi":"Okulaari on optisen laitteen, kuten mikroskoopin tai kaukoputken, silmää lähinnä oleva linssi tai linssiryhmä. Se toimii suurennuslasina objektiivin muodostamalle todelliselle välikuvalle ja suurentaa kulmaa, jossa havaitsija näkee tämän kuvan. Useimmissa rakenteissa välikuva on okulaarin polttopisteessä, jolloin okulaari muodostaa virtuaalisen, suurennetun kuvan äärettömän kauas, eli okulaarista lähtevät säteet ovat yhdensuuntaisia. Näin kuvaa voi katsoa rentoutunein silmin, jotka on tarkennettu äärettömyyteen."}},{"id":26,"ch":"10","q":{"fi":"Selitä muutamalla lauseella kuinka Galileon teleskooppi toimii. Kerro onko kyseinen teleskooppi afokaalinen?","en":"In a few sentences, explain how a Galilean telescope works. Is this telescope afocal?"},"a":{"en":"A Galilean telescope has a positive (converging) objective and a negative (diverging) eyepiece, separated by f_o − |f_e|, the focal length of the objective minus the magnitude of that of the eyepiece. The eyepiece intercepts the converging rays before the real image of the objective forms, so the observer sees an upright virtual image magnified by M = f_o/|f_e|. Yes, it is afocal when used for distant objects: parallel rays enter and leave parallel, because the focal points of the two lenses coincide, so the eye can view it relaxed. The image is upright and the tube short, but the field of view is narrow; the design is used in opera glasses.","fi":"Galilein kaukoputkessa on positiivinen (kokoava) objektiivi ja negatiivinen (hajottava) okulaari, joiden etäisyys toisistaan on f_o − |f_e|, eli objektiivin polttoväli miinus okulaarin polttovälin itseisarvo. Okulaari katkaisee kokoavat säteet ennen kuin objektiivin todellinen kuva ehtii muodostua, joten havaitsija näkee pystyn, virtuaalisen kuvan, jonka suurennus on M = f_o/|f_e|. Kyllä, kaukoputki on afokaalinen kaukaisia kohteita katsottaessa: yhdensuuntaiset säteet tulevat sisään ja lähtevät yhdensuuntaisina, koska linssien polttopisteet yhtyvät, joten silmä voi katsoa rentona. Kuva on pysty ja putki lyhyt, mutta näkökenttä on kapea; rakennetta käytetään oopperakiikareissa."}},{"id":27,"ch":"10","q":{"fi":"Selitä muutamalla lauseella kuinka Keplerin teleskooppi toimii. Kerro onko kyseinen teleskooppi afokaalinen?","en":"In a few sentences, explain how a Keplerian telescope works. Is this telescope afocal?"},"a":{"en":"A Keplerian telescope has two converging lenses: an objective with a long focal length f_o and an eyepiece with a short focal length f_e, separated by f_o + f_e. The objective forms a real, inverted intermediate image in its focal plane, which coincides with the focal plane of the eyepiece, and the eyepiece works as a magnifier for this image. The angular magnification is M = −f_o/f_e, where the minus sign means that the final image is inverted. Yes, it is afocal: parallel rays enter and leave parallel, because the back focal point of the objective coincides with the front focal point of the eyepiece.","fi":"Keplerin kaukoputkessa on kaksi kokoavaa linssiä: pitkäpolttovälinen objektiivi (f_o) ja lyhytpolttovälinen okulaari (f_e), joiden etäisyys toisistaan on f_o + f_e. Objektiivi muodostaa polttotasoonsa todellisen, ylösalsäisen välikuvan, joka on okulaarin polttotasossa, ja okulaari toimii tämän kuvan suurennuslasina. Kulmasuurennus on M = −f_o/f_e, missä miinusmerkki osoittaa lopullisen kuvan olevan ylösalsäisin. Kyllä, se on afokaalinen: yhdensuuntaiset säteet tulevat sisään ja lähtevät yhdensuuntaisina, koska objektiivin takapolttopiste yhtyy okulaarin etupolttopisteeseen."}},{"id":28,"ch":"10","q":{"fi":"Selitä muutamalla lauseella kuinka Newtonin teleskooppi toimii. Kerro myös mitä etuja mallilla on verrattuna Keplerin ja Galileon teleskooppimalleihin.","en":"In a few sentences, explain how a Newtonian telescope works. Also, explain what advantages this design has compared to Keplerian and Galilean telescope models."},"a":{"en":"A Newtonian telescope is a reflecting telescope: a concave, parabolic primary mirror at the closed end of the tube collects the light and focuses it, and a small flat secondary mirror at 45° near the focus sends the beam out through the side of the tube to the eyepiece. Since it uses a mirror instead of a lens, it has no chromatic aberration, because reflection does not depend on wavelength. A mirror can be supported from behind and made much larger than a lens, which gives more light collection and better resolution at lower cost. In addition, a parabolic mirror has no spherical aberration for an on-axis object, advantages that the Keplerian and Galilean lens telescopes do not have.","fi":"Newtonin kaukoputki on peilikaukoputki: putken suljetussa päässä oleva kovera, paraboloidinen pääpeili kerää valon ja tarkentaa sen, ja polttopisteen lähellä oleva pieni 45°:n kulmassa oleva tasopeili ohjaa säteet putken kyljestä okulaariin. Koska se käyttää peiliä linssin sijaan, siinä ei ole kromaattista aberraatiota, sillä heijastus ei riipu aallonpituudesta. Peili voidaan tukea takaa ja tehdä paljon linssiä suuremmaksi, mikä antaa enemmän valoa ja paremman erotuskyvyn edullisemmin. Lisäksi paraboloidipeilillä ei ole pallopinta-aberraatiota optisella akselilla olevalle kohteelle, ja nämä edut puuttuvat Keplerin ja Galilein linssikaukoputkilta."}},{"id":29,"ch":"10","q":{"fi":"Kerro lyhyesti kuinka linssin takapolttoväli määritellään.","en":"Briefly explain how the back focal length of a lens is defined."},"a":{"en":"The back focal length of a lens is the distance from the back (image-side) principal plane to the back focal point F′. The back focal point is where rays that arrive parallel to the optical axis from the object side converge after the lens; for a diverging lens it is the point from which these rays appear to diverge. It tells where the image of a very distant object is formed. The back focal length is measured from the principal plane, not from the last lens surface, so for a thick lens it differs from the back focal distance.","fi":"Linssin takapolttoväli on etäisyys takapäätasosta (kuvapuolen päätasosta) takapolttopisteeseen F′. Takapolttopiste on kohta, johon optisen akselin suuntaisena kohdepuolelta tulevat säteet kokoontuvat linssin jälkeen; hajottavalla linssillä se on kohta, josta säteet näyttävät hajaantuvan. Se kertoo, mihin hyvin kaukaisen kohteen kuva muodostuu. Takapolttoväli mitataan päätasosta, ei viimeisestä linssipinnasta, joten paksulla linssillä se poikkeaa takapolttoetäisyydestä."}},{"id":30,"ch":"10","q":{"fi":"Kerro lyhyesti kuinka linssin etupolttoväli määritellään.","en":"Briefly explain how the front focal length of a lens is defined."},"a":{"en":"The front focal length of a lens is the distance from the front (object-side) principal plane to the front focal point F. The front focal point is the point on the object side from which rays leave the lens parallel to the axis, i.e. an object at F has its image at infinity. Equivalently, for a converging lens, parallel rays sent through the lens from the image side are focused at F; for a diverging lens F is a virtual point, and rays aimed towards it emerge parallel. Like the back focal length, it is measured from the principal plane, and for a thin lens in air the front and back focal lengths are equal.","fi":"Linssin etupolttoväli on etäisyys etupäätasosta (kohdepuolen päätasosta) etupolttopisteeseen F. Etupolttopiste on kohdepuolen piste, josta lähtevät säteet kulkevat linssin jälkeen akselin suuntaisina, eli pisteessä F olevan kohteen kuva on äärettömässä. Vastaavasti kokoavalle linssille kuvan puolelta linssin läpi lähetetyt yhdensuuntaiset säteet kokoontuvat pisteeseen F; hajottavalla linssillä F on virtuaalinen piste, jota kohti tähdätyt säteet tulevat ulos yhdensuuntaisina. Takapolttovälin tapaan etupolttoväli mitataan päätasosta, ja ohuelle ilmassa olevalle linssille etu- ja takapolttoväli ovat yhtä suuret."}},{"id":31,"ch":"10","q":{"fi":"Kerro lyhyesti mitä optisella mikroskoopilla voidaan tehdä, ja millaisista komponenteista se yksinkertaisimmillaan koostuu.","en":"Briefly explain what can be done with an optical microscope and what components it consists of in its simplest form."},"a":{"en":"An optical microscope magnifies small objects so that structures invisible to the naked eye, such as cells, microorganisms or the microstructure of materials, can be observed; its resolution is limited by diffraction to about λ/(2 NA). In its simplest form it consists of two converging lens systems: a short-focal-length objective that forms a real, enlarged intermediate image of the specimen, and an eyepiece that acts as a magnifier for this image. In addition, a light source (with a condenser) illuminates the specimen, which sits on a stage. The total magnification is the product of the magnifications of the objective and the eyepiece.","fi":"Optisella mikroskoopilla suurennetaan pieniä kohteita niin, että paljain silmin näkymättömiä rakenteita, kuten soluja, mikro-organismeja tai materiaalien mikrorakennetta, voidaan tarkastella; erotuskykyä rajoittaa diffraktio, noin λ/(2 NA). Yksinkertaisimmillaan se koostuu kahdesta kokoavasta linssijärjestelmästä: lyhytpolttovälisestä objektiivista, joka muodostaa näytteestä todellisen, suurennetun välikuvan, ja okulaarista, joka toimii tämän kuvan suurennuslasina. Lisäksi tarvitaan valonlähde (ja kondensori) näytteen valaisuun sekä näytepöytä. Kokonaissuurennus on objektiivin ja okulaarin suurennusten tulo."}},{"id":32,"ch":"10","q":{"fi":"Kerro lyhyesti mitä on kromaattinen aberraatio.","en":"Briefly explain what chromatic aberration is."},"a":{"en":"Chromatic aberration is an imaging error of lenses caused by dispersion: the refractive index of the glass depends on the wavelength, so each colour is refracted differently. The focal length is therefore different for different colours (shorter for blue than for red), and the colours come to a focus at different distances from the lens. The image of a white point is blurred and shows coloured fringes, especially at edges. The error can be reduced with achromatic doublets, which combine a converging and a diverging lens made of different glasses, or avoided by using mirrors.","fi":"Kromaattinen aberraatio on linssin kuvausvirhe, jonka aiheuttaa dispersio: lasin taitekerroin riippuu aallonpituudesta, joten kukin väri taittuu eri tavalla. Siksi polttoväli on eri väreille eri suuri (siniselle lyhyempi kuin punaiselle) ja värit tarkentuvat eri etäisyydelle linssistä. Valkoisen pisteen kuva sumenee ja siinä näkyy värillisiä reunoja erityisesti kuvan reunoilla. Virhettä voidaan pienentää akromaattisilla dubleteilla, joissa yhdistetään eri lasista tehty kokoava ja hajottava linssi, tai välttää käyttämällä peilejä."}}]};
</script>
<script>
(function(){
"use strict";
var CH = DATA.chapters, QS = DATA.questions;
var chById = {}; CH.forEach(function(c){ chById[c.id] = c; });
document.documentElement.style.setProperty("--spectrum",
  "linear-gradient(90deg," + CH.map(function(c,i,a){
    return c.color+" "+(i/a.length*100).toFixed(2)+"% "+((i+1)/a.length*100).toFixed(2)+"%"; }).join(",") + ")");

var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var app = $("#app");

var I = {
en:{
 title:"Explain Briefly", back:"Back to FYS.240 Optics course", langLabel:"Language",
 tagline:"FYS.240 Optics. Read the question together, agree on an answer in your group, and only then reveal the model answer.",
 how:"How it works",
 steps:["Read the question on the card.","Discuss in your group and agree on a short answer (a few sentences).","Press Show answer and compare. What did you miss?"],
 chapters:"Chapters", hint:"Pick the chapters to practise.", all:"Select all", clear:"Clear",
 order:"Order", inOrder:"Course order", shuffled:"Shuffled",
 count:function(n){return n+" questions";}, pickOne:"Pick at least one chapter.", start:"Start",
 home:"\u2190 Start page", chapter:"Chapter", question:"Question",
 discuss:"Discuss in your group and agree on your answer. Then press Show answer.",
 show:"Show answer", hide:"Hide answer", answer:"Model answer", prev:"Previous", next:"Next", done:"Finish",
 keys:"<kbd>Space</kbd> answer \u00a0 <kbd>\u2190</kbd> <kbd>\u2192</kbd> previous / next",
 of:function(i,n){return i+" / "+n;}
},
fi:{
 title:"Selit\u00e4 lyhyesti", back:"Takaisin FYS.240 Optiikka sivulle", langLabel:"Kieli",
 tagline:"FYS.240 Optiikka. Lukekaa kysymys yhdess\u00e4, sopikaa ryhm\u00e4ss\u00e4 vastaus ja paljastakaa mallivastaus vasta sitten.",
 how:"N\u00e4in k\u00e4yt\u00e4t",
 steps:["Lue kysymys kortilta.","Keskustelkaa ryhm\u00e4ss\u00e4 ja sopikaa lyhyt vastaus (muutama lause).","Paina N\u00e4yt\u00e4 vastaus ja vertaa. Mit\u00e4 j\u00e4i puuttumaan?"],
 chapters:"Luvut", hint:"Valitse luvut, joita haluat harjoitella.", all:"Valitse kaikki", clear:"Tyhjenn\u00e4",
 order:"J\u00e4rjestys", inOrder:"Kurssin j\u00e4rjestys", shuffled:"Sekoitettu",
 count:function(n){return n+" kysymyst\u00e4";}, pickOne:"Valitse v\u00e4hint\u00e4\u00e4n yksi luku.", start:"Aloita",
 home:"\u2190 Aloitussivulle", chapter:"Luku", question:"Kysymys",
 discuss:"Keskustelkaa ryhm\u00e4ss\u00e4 ja sopikaa vastaus. Paina sitten N\u00e4yt\u00e4 vastaus.",
 show:"N\u00e4yt\u00e4 vastaus", hide:"Piilota vastaus", answer:"Mallivastaus", prev:"Edellinen", next:"Seuraava", done:"Valmis",
 keys:"<kbd>V\u00e4li</kbd> vastaus \u00a0 <kbd>\u2190</kbd> <kbd>\u2192</kbd> edellinen / seuraava",
 of:function(i,n){return i+" / "+n;}
}};

var store = {
  get:function(k,d){ try{ var v = localStorage.getItem("fys240explain."+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem("fys240explain."+k, JSON.stringify(v)); }catch(e){} }
};
var qp = new URLSearchParams(location.search).get("lang");
var S = Object.assign({lang:((navigator.language||"").slice(0,2)==="fi"?"fi":"en"), chapters:CH.map(function(c){return c.id;}), shuffle:false}, store.get("settings",{}));
if(qp==="fi" || qp==="en") S.lang = qp;
S.chapters = (S.chapters||[]).filter(function(id){ return chById[id]; });
function save(){ store.set("settings", S); }
function tr(k){ var v = I[S.lang][k]; return typeof v==="function" ? v.apply(null, Array.prototype.slice.call(arguments,1)) : v; }
function L(o){ return o[S.lang]; }
function chShort(c){ return S.lang==="fi" ? c.short_fi : c.short; }
function countFor(id){ return QS.filter(function(q){return q.ch===id;}).length; }
function pool(){ return QS.filter(function(q){ return S.chapters.indexOf(q.ch)>=0; }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function applyLang(){ document.documentElement.lang = S.lang; document.title = tr("title"); }

var view = "start", D = null;
function show(html, name, keep){
  var key=null, a=document.activeElement;
  if(keep && a && a.dataset && a.dataset.act) key = a.dataset.act+"|"+(a.dataset.val==null?"":a.dataset.val);
  view = name; app.innerHTML = html;
  if(key){
    var p=key.split("|"), el=Array.prototype.find.call(app.querySelectorAll("[data-act]"), function(x){ return x.dataset.act===p[0] && (x.dataset.val==null?"":x.dataset.val)===p[1]; });
    if(el){ el.focus({preventScroll:true}); return; }
  }
  var h = app.querySelector("[data-h]"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
  if(!keep) window.scrollTo(0,0);
}
function langSwitch(){
  return '<div class="lang" role="group" aria-label="'+tr("langLabel")+'">'+[["en","EN","English"],["fi","FI","Suomi"]].map(function(l){
    return '<button type="button" data-act="lang" data-val="'+l[0]+'" lang="'+l[0]+'" title="'+l[2]+'" aria-pressed="'+(S.lang===l[0])+'">'+l[1]+'</button>'; }).join("")+'</div>';
}

function renderStart(keep){
  applyLang();
  var n = pool().length;
  var chips = CH.map(function(c){ var on = S.chapters.indexOf(c.id)>=0;
    return '<button type="button" class="chip" data-act="ch" data-val="'+c.id+'" aria-pressed="'+on+'" style="--c:'+c.color+';--ci:'+c.ink+'"><span class="no">'+c.id+'</span><span class="nm">'+esc(chShort(c))+'</span><span class="ct">'+tr("count",countFor(c.id))+'</span></button>'; }).join("");
  show('<div class="wrap"><header class="mast"><div class="top"><a class="back" href="../index.html">\u2190 '+tr("back")+'</a>'+langSwitch()+'</div>'+
    '<h1 data-h>'+tr("title")+'</h1><p>'+tr("tagline")+'</p><div class="spectrum" aria-hidden="true"></div></header>'+
    '<details class="rules"><summary>'+tr("how")+'</summary><ol>'+tr("steps").map(function(s){return "<li>"+s+"</li>";}).join("")+'</ol></details>'+
    '<section class="sec"><h2>'+tr("chapters")+'</h2><p class="hint">'+tr("hint")+'</p><div class="chips">'+chips+'</div>'+
    '<div class="toolrow"><button type="button" class="tbtn" data-act="allch">'+tr("all")+'</button><button type="button" class="tbtn" data-act="noch">'+tr("clear")+'</button></div></section>'+
    '<section class="sec"><h2>'+tr("order")+'</h2><div class="seg" role="group">'+
      '<button type="button" data-act="order" data-val="0" aria-pressed="'+!S.shuffle+'">'+tr("inOrder")+'</button>'+
      '<button type="button" data-act="order" data-val="1" aria-pressed="'+S.shuffle+'">'+tr("shuffled")+'</button></div></section></div>'+
    '<div class="dock"><div class="dock-in"><div class="info"><b>'+tr("count",n)+'</b>'+(n<1?'<br>'+tr("pickOne"):"")+'</div>'+
    '<button type="button" class="btn" data-act="start"'+(n?"":" disabled")+'>'+tr("start")+'</button></div></div>', "start", keep);
}

function start(){
  var p = pool(); if(!p.length) return;
  D = {list:(S.shuffle?shuffle(p):p).map(function(q){return q.id;}), pos:0, rev:false};
  renderQ(); window.scrollTo(0,0);
}
function renderQ(){
  var q = QS[D.list[D.pos]-1], c = chById[q.ch], n = D.list.length, last = D.pos===n-1;
  var ans = D.rev ? '<div class="ans"><h3>'+tr("answer")+'</h3><p>'+esc(L(q.a))+'</p></div>' : '<p class="discuss">'+tr("discuss")+'</p>';
  show('<div class="wrap q"><div class="bar"><button type="button" class="homebtn" data-act="home">'+tr("home")+'</button><span class="count" aria-live="polite">'+tr("of",D.pos+1,n)+'</span></div>'+
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+(D.pos+1)+'"><i style="width:'+((D.pos+1)/n*100).toFixed(1)+'%"></i></div>'+
    '<article class="qcard" style="--c:'+c.color+';--ci:'+c.ink+'"><div class="stripe"></div><div class="in"><div class="meta"><span class="tag">'+tr("chapter")+' '+c.id+'</span><span>'+esc(chShort(c))+'</span></div>'+
    '<h2 class="q" data-h>'+esc(L(q.q))+'</h2></div></article>'+ans+
    '<div class="grow"><button type="button" class="btn wide" data-act="toggle">'+(D.rev?tr("hide"):tr("show"))+'</button></div>'+
    '<div class="nav"><button type="button" class="btn ghost" data-act="prev"'+(D.pos?"":" disabled")+'>\u2039 '+tr("prev")+'</button>'+
    '<button type="button" class="btn ghost" data-act="'+(last?"home":"next")+'">'+(last?tr("done"):tr("next")+' \u203a')+'</button></div>'+
    '<div class="keys">'+tr("keys")+'</div></div>', "q", true);
}
function go(d){ var p = D.pos+d; if(p<0 || p>=D.list.length) return; D.pos=p; D.rev=false; renderQ(); window.scrollTo(0,0); }

var actions = {
  lang:function(b){ S.lang=b.dataset.val; save(); renderStart(true); },
  ch:function(b){ var id=b.dataset.val,k=S.chapters.indexOf(id); if(k>=0) S.chapters.splice(k,1); else S.chapters.push(id); save(); renderStart(true); },
  allch:function(){ S.chapters = CH.map(function(c){return c.id;}); save(); renderStart(true); },
  noch:function(){ S.chapters = []; save(); renderStart(true); },
  order:function(b){ S.shuffle = b.dataset.val==="1"; save(); renderStart(true); },
  start:start,
  home:function(){ D=null; renderStart(); },
  toggle:function(){ D.rev=!D.rev; renderQ(); },
  prev:function(){ go(-1); }, next:function(){ go(1); }
};
app.addEventListener("click", function(e){ var b=e.target.closest("[data-act]"); if(!b||b.disabled) return; var f=actions[b.dataset.act]; if(f) f(b,e); });
document.addEventListener("keydown", function(e){
  if(view!=="q" || e.ctrlKey||e.metaKey||e.altKey) return;
  var tag=(e.target.tagName||"").toLowerCase(), onCtl = tag==="button"||tag==="a"||tag==="summary";
  if((e.key===" "||e.key==="Enter") && !onCtl){ e.preventDefault(); D.rev=!D.rev; renderQ(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); if(D.pos<D.list.length-1) go(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
});
renderStart();
})();
</script>
