<style>
:root{
  --bg:#f1f3f8; --panel:#ffffff; --ink:#0f1a30; --muted:#586279; --line:#d3d9e6;
  --btn:#0f1a30; --btn-ink:#ffffff; --focus:#1c6fd6; --ok:#1e8a3e; --bad:#c2303f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1120; --panel:#141c2e; --ink:#eaf0fb; --muted:#9aa7c0; --line:#26314a;
         --btn:#eaf0fb; --btn-ink:#0b1120; --focus:#8bb6ff; --ok:#3fbf6b; --bad:#ff6b7a; }
  .btn.ok,.tog[data-r="ok"]{color:#06210f}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 140px}
.wrap.game{padding-bottom:40px}
h1,h2,h3{margin:0}
[tabindex="-1"]:focus{outline:none}

/* masthead */
.mast h1{font:700 clamp(2.5rem,8vw,3.9rem)/1 var(--serif);letter-spacing:-.02em}
.mast p{margin:.45rem 0 0;color:var(--muted);max-width:46ch}
.spectrum{height:9px;border-radius:5px;margin:16px 0 26px;background:var(--spectrum)}
.mast-sm{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.mast-sm .name{font:700 1.25rem var(--serif)}
.mast-sm .lnk{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0}

/* setup */
.sec{margin:0 0 26px}
.sec>h2{font:600 1rem var(--sans);margin-bottom:10px}
.sec .hint{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.seg.big button{padding:16px 12px;font-size:1.05rem}
.seg.big small{display:block;font-weight:400;opacity:.8;font-size:.82rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.chip{--c:#888;--ci:#fff;position:relative;text-align:left;padding:10px 12px 10px 14px;border-radius:12px;border:2px solid var(--c);background:var(--panel);display:grid;gap:1px}
.chip .no{font:700 1.5rem/1 var(--serif)}
.chip .nm{font-size:.83rem;line-height:1.25}
.chip .ct{font-size:.78rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--c);color:var(--ci)}
.chip[aria-pressed="true"] .ct{color:inherit;opacity:.85}
.chip[aria-pressed="false"]::after{content:"";position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tbtn{background:none;border:0;padding:6px 2px;text-decoration:underline;color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--btn)}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:1.3rem;line-height:1}
.stepper b{min-width:2ch;text-align:center;font-size:1.2rem}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px}
.names label{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
.names input{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
details.rules{border:1.5px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px;margin-bottom:26px}
details.rules summary{cursor:pointer;font-weight:600}
details.rules p{margin:.6rem 0 0;color:var(--muted)}
details.rules ul{margin:.5rem 0 0;padding-left:1.2rem;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock-in{max-width:728px;margin:0 auto;display:flex;gap:12px;align-items:center}
.dock-in .info{flex:1;color:var(--muted);font-size:.92rem;line-height:1.3}
.btn{border:0;border-radius:12px;padding:14px 22px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:1.05rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.wide{width:100%}

/* game chrome */
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 10px}
.hud .who{font:700 1.15rem var(--serif)}
.hud .sc{color:var(--muted);font-size:.92rem}
.clock{font:700 2.6rem/1 var(--sans);font-variant-numeric:tabular-nums}
.clock.hurry{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:var(--btn);transform-origin:left;transition:transform .25s linear}
.bar.hurry i{background:var(--bad)}
.stage{display:flex;justify-content:center}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;max-width:440px;margin:18px auto 0}
.actions .btn{padding:18px 12px;font-size:1.15rem}
.actions.one{grid-template-columns:1fr}
.keys{text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px}
kbd{font:inherit;font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}

/* the card: 58 x 89 mm, same as the physical template */
.card{--c:#888;--ci:#fff;container-type:inline-size;width:clamp(220px,calc((100dvh - 290px)*.6517),330px);max-width:100%;aspect-ratio:58/89;background:#fff;color:#11192b;border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 18px 34px -14px rgba(6,12,28,.5);display:flex;flex-direction:column;overflow:hidden;position:relative}
.card .stripe{height:4cqw;background:var(--c);flex:none}
.card .meta{padding:5cqw 7cqw 0;font:600 4.3cqw/1.25 var(--sans);color:#4a556b}
.card .meta b{color:#11192b}
.card .tag{display:inline-block;margin-top:2cqw;padding:.6cqw 2.4cqw;border-radius:2cqw;background:var(--c);color:var(--ci);font-size:3.6cqw;font-weight:700}
.card .term{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2cqw 7cqw;font-family:var(--serif);font-weight:700;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;hyphens:auto;overflow-wrap:break-word;font-size:14cqw}
.card .term.t-m{font-size:12cqw}.card .term.t-l{font-size:10cqw}.card .term.t-xl{font-size:8.2cqw}
.card .taboo{flex:none;padding:3.6cqw 7cqw 6cqw;border-top:.6cqw solid #e3e7ef}
.card .tl{font:700 3.9cqw/1.2 var(--sans);color:#4a556b;margin-bottom:2.2cqw}
.card .tl span{font-weight:500}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:1.3cqw}
.card li{font:600 5.3cqw/1.2 var(--sans);display:flex;gap:2.4cqw;align-items:baseline}
.card li::before{content:"\00d7";color:var(--c);font-weight:800;filter:saturate(1.2) brightness(.85)}
.card ul.rel li::before{content:"\2022";filter:none}
.card.swap{animation:swap .18s ease-out}
@keyframes swap{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.card .prompt{font:500 4.6cqw/1.35 var(--sans);color:#4a556b;text-align:center;padding:0 7cqw 6cqw}
.card .lecture{display:block;margin:1.5cqw 7cqw 6cqw;font:600 4.3cqw/1.3 var(--sans);color:#11192b}

/* lists */
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .sw{width:10px;height:28px;border-radius:3px;flex:none;background:var(--c)}
.row .tm{flex:1;min-width:0;font-weight:600}
.row .tm small{display:block;font-weight:400;color:var(--muted)}
.tog{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-weight:700;min-width:96px}
.tog[data-r="ok"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tog[data-r="skip"]{color:var(--muted)}
.lec{color:var(--muted);font-size:.88rem}
.board{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.board li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);font-weight:600}
.board li.cur{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn)}
.board li.win{border-color:var(--ok)}
.board .pts{font:700 1.4rem var(--serif);font-variant-numeric:tabular-nums}
.big-h{font:700 clamp(1.7rem,6vw,2.4rem)/1.1 var(--serif);margin:10px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.grow{display:grid;gap:10px;margin-top:16px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--btn)}
noscript{display:block;padding:20px}

/* print: A4, 3 x 3 cards of 58 x 89 mm */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm 17mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important}
  #app{display:none!important}
  #print{display:block}
  .sheet{display:grid;grid-template-columns:repeat(3,58mm);grid-auto-rows:89mm;width:174mm;break-after:page}
  .sheet:last-child{break-after:auto}
  .sheet .card{width:58mm;height:89mm;aspect-ratio:auto;border-radius:0;box-shadow:none;outline:.25mm solid #9aa3b5;outline-offset:-.25mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var app = $("#app");

/* ---------- persistence (settings only) ---------- */
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem("fys240alias."+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem("fys240alias."+k, JSON.stringify(v)); }catch(e){} }
};
var DEFAULTS = {mode:"team", chapters:CH.filter(function(c){return c.id!=="M";}).map(function(c){return c.id;}),
  exam:false, teamCount:2, teamNames:["Team 1","Team 2","Team 3","Team 4"], roundSec:60, rounds:2, penalty:true, lang:"en"};
var S = Object.assign({}, DEFAULTS, store.get("settings", {}));
S.chapters = (S.chapters||[]).filter(function(id){ return chById[id]; });
if(!Array.isArray(S.teamNames) || S.teamNames.length < 4) S.teamNames = DEFAULTS.teamNames.slice();
function save(){ store.set("settings", S); }

/* ---------- helpers ---------- */
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function deckTerms(){ return TERMS.filter(function(t){ return S.chapters.indexOf(t.ch) >= 0 && (!S.exam || t.ex); }); }
function countFor(id){ return TERMS.filter(function(t){ return t.ch===id && (!S.exam || t.ex); }).length; }
function lecture(t, cls){
  var v = VIDEOS[t.sec]; if(!v) return "";
  var fi = S.lang==="fi" && v.url_fi;
  var url = fi ? v.url_fi : v.url, topic = fi ? (v.topic_fi || v.topic) : v.topic;
  return '<a class="'+(cls||"lec")+'" href="'+esc(url)+'" target="_blank" rel="noopener">Lecture '+esc(t.sec)+': '+esc(topic)+'</a>';
}
function termSize(s){ var n = s.length; return n<=10 ? "" : n<=17 ? "t-m" : n<=26 ? "t-l" : "t-xl"; }
function cardHTML(t, o){
  o = o || {}; var c = chById[t.ch];
  var meta = '<div class="meta"><b>'+(t.ch==="M"?"Extra":"Chapter "+esc(t.ch))+'</b> '+esc(c.short)+
    (t.ex ? '<br><span class="tag">Exam topic</span>' : '')+'</div>';
  var low;
  if(o.study === 1) low = '<div class="prompt">Explain it in two or three sentences, aloud or on paper. Then check yourself.</div>';
  else if(o.study === 2) low = '<div class="taboo"><div class="tl">A good explanation touches on</div><ul class="rel">'+t.tb.map(function(w){return "<li>"+esc(w)+"</li>";}).join("")+'</ul></div>'+(lecture(t,"lecture")||"");
  else low = '<div class="taboo"><div class="tl">Do not say <span>(or any word of the term)</span></div><ul>'+t.tb.map(function(w){return "<li>"+esc(w)+"</li>";}).join("")+'</ul></div>';
  return '<div class="card'+(o.swap?" swap":"")+'" style="--c:'+c.color+';--ci:'+c.ink+'"><div class="stripe"></div>'+meta+
    '<div class="term '+termSize(t.t)+'">'+esc(t.t)+'</div>'+low+'</div>';
}

/* ---------- screens ---------- */
var view = "setup";
function show(html, name, keepFocus){
  var key = null, a = document.activeElement;
  if(keepFocus && a && a.dataset && a.dataset.act) key = a.dataset.act+"|"+(a.dataset.val==null?"":a.dataset.val);
  view = name; app.innerHTML = html;
  if(key){
    var p = key.split("|"), el = Array.prototype.find.call(app.querySelectorAll("[data-act]"), function(x){ return x.dataset.act===p[0] && (x.dataset.val==null?"":x.dataset.val)===p[1]; });
    if(el){ el.focus({preventScroll:true}); return; }
  }
  var h = app.querySelector("[data-h]"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
  if(!keepFocus) window.scrollTo(0,0);
}
function seg(act, cur, items){
  return '<div class="seg" role="group">'+items.map(function(it){
    return '<button type="button" data-act="'+act+'" data-val="'+esc(it[0])+'" aria-pressed="'+(String(cur)===String(it[0]))+'">'+esc(it[1])+'</button>'; }).join("")+'</div>';
}

function renderSetup(keep){
  var deck = deckTerms(), team = S.mode==="team";
  var chips = CH.map(function(c){
    var n = countFor(c.id), on = S.chapters.indexOf(c.id)>=0;
    return '<button type="button" class="chip" data-act="ch" data-val="'+c.id+'" aria-pressed="'+on+'"'+(n?"":" disabled")+' style="--c:'+c.color+';--ci:'+c.ink+'">'+
      '<span class="no">'+(c.id==="M"?"Extra":c.id)+'</span><span class="nm">'+esc(c.short)+'</span><span class="ct">'+n+' cards</span></button>'; }).join("");
  var nEx = TERMS.filter(function(t){return t.ex;}).length;
  var names = "";
  for(var i=0;i<S.teamCount;i++) names += '<label>Team '+(i+1)+'<input type="text" maxlength="24" data-team="'+i+'" value="'+esc(S.teamNames[i])+'"></label>';
  var html = '<div class="wrap">'+
   '<header class="mast"><h1 data-h>Term Alias</h1><p>FYS.240 Optics. Describe a course term without saying it, and recap the main concepts while you play.</p><div class="spectrum" aria-hidden="true"></div></header>'+
   '<details class="rules"><summary>How it works</summary><p><b>Team game.</b> One player describes the term on the card. Teammates guess it out loud. Do not say the term, any word of it, or the forbidden words. No spelling, gestures or translations. A correct guess scores a point.</p><p><b>Study alone.</b> Explain each term in your own words, like the exam\u2019s explain-briefly questions, then reveal the related concepts and open the lecture video if it was shaky.</p></details>'+
   '<section class="sec"><h2>Mode</h2><div class="seg big" role="group">'+
     '<button type="button" data-act="mode" data-val="team" aria-pressed="'+team+'">Play with teams<small>2 to 4 teams, one device</small></button>'+
     '<button type="button" data-act="mode" data-val="study" aria-pressed="'+!team+'">Study alone<small>Explain, reveal, check</small></button></div></section>'+
   '<section class="sec"><h2>Chapters in the deck</h2><p class="hint">The colours follow the spectrum, from chapter 2 (red) to chapter 10 (violet).</p><div class="chips">'+chips+'</div>'+
     '<div class="toolrow"><button type="button" class="tbtn" data-act="allch">Select all</button><button type="button" class="tbtn" data-act="noch">Clear</button>'+
     '<button type="button" class="tbtn" data-act="printcards"'+(deck.length?"":" disabled")+'>Print cards (A4, 58 \u00d7 89 mm)</button></div>'+
     '<label class="switch"><input type="checkbox" data-act="exam"'+(S.exam?" checked":"")+'> Only topics from the exam explain-questions ('+nEx+' terms)</label></section>';
  if(team){
    html += '<section class="sec"><h2>Teams</h2><div class="stepper"><button type="button" data-act="teams" data-val="-1" aria-label="Fewer teams">\u2212</button><b>'+S.teamCount+'</b><button type="button" data-act="teams" data-val="1" aria-label="More teams">+</button><span class="lec">teams</span></div><div class="names">'+names+'</div></section>'+
     '<section class="sec"><h2>Round length</h2>'+seg("sec", S.roundSec, [[30,"30 s"],[60,"60 s"],[90,"90 s"]])+'</section>'+
     '<section class="sec"><h2>Rounds per team</h2>'+seg("rounds", S.rounds, [[1,"1"],[2,"2"],[3,"3"],[5,"5"]])+
       '<label class="switch"><input type="checkbox" data-act="penalty"'+(S.penalty?" checked":"")+'> A skipped card costs a point</label></section>';
  }
  html += '<section class="sec"><h2>Lecture links</h2>'+seg("lang", S.lang, [["en","English videos"],["fi","Finnish videos"]])+'</section>'+
   '</div><div class="dock"><div class="dock-in"><div class="info"><b>'+deck.length+' cards</b> in the deck'+(deck.length<1?"<br>Pick at least one chapter.":"")+'</div>'+
   '<button type="button" class="btn" data-act="start"'+(deck.length?"":" disabled")+'>'+(team?"Start game":"Start studying")+'</button></div></div>';
  show(html, "setup", keep);
}

/* ---------- team game ---------- */
var G = null, timer = null;
function startGame(){
  var pool = deckTerms(); if(!pool.length) return;
  G = {teams:[], total:S.teamCount*S.rounds, turn:0, deck:shuffle(pool.map(function(t){return t.i;})), pos:0, log:[], cur:null, deadline:0, all:{}};
  for(var i=0;i<S.teamCount;i++) G.teams.push({name:(S.teamNames[i]||"").trim()||("Team "+(i+1)), score:0});
  renderIntro();
}
function draw(){
  if(G.pos >= G.deck.length){ G.deck = shuffle(deckTerms().map(function(t){return t.i;})); G.pos = 0; }
  return G.deck[G.pos++];
}
function teamNow(){ return G.teams[G.turn % G.teams.length]; }
function roundScore(){
  var ok = 0, sk = 0; G.log.forEach(function(e){ if(e.r==="ok") ok++; else sk++; });
  return ok - (S.penalty ? sk : 0);
}
function boardHTML(highlight){
  return '<ul class="board">'+G.teams.map(function(t,i){ return '<li'+(highlight && i===G.turn%G.teams.length?' class="cur"':"")+'><span>'+esc(t.name)+'</span><span class="pts">'+t.score+'</span></li>'; }).join("")+'</ul>';
}
function renderIntro(){
  var round = Math.floor(G.turn/G.teams.length)+1;
  show('<div class="wrap game"><div class="mast-sm"><span class="name">Term Alias</span><button type="button" class="lnk" data-act="quit">End game</button></div>'+
    '<div class="spectrum" aria-hidden="true" style="margin:8px 0 20px"></div>'+
    '<p class="sub">Round '+round+' of '+S.rounds+'</p>'+
    '<h2 class="big-h" data-h>'+esc(teamNow().name)+', you\u2019re up</h2>'+
    '<p class="sub">Choose one describer and hold the screen so only they can see it. Everyone else guesses out loud.</p>'+
    boardHTML(true)+
    '<div class="grow"><button type="button" class="btn wide" data-act="startround">Start '+S.roundSec+' second round</button></div></div>', "intro");
}
function startRound(){
  G.log = []; G.cur = draw(); G.deadline = Date.now() + S.roundSec*1000;
  show('<div class="wrap game"><div class="hud"><div><div class="who" data-h>'+esc(teamNow().name)+'</div><div class="sc" id="sc"></div></div><div class="clock" id="clock" role="timer">'+S.roundSec+'</div></div>'+
    '<div class="bar" id="bar"><i id="barfill"></i></div>'+
    '<div class="stage" id="slot">'+cardHTML(TERMS[G.cur])+'</div>'+
    '<div class="actions"><button type="button" class="btn ghost" data-act="skip">Skip'+(S.penalty?" (\u22121)":"")+'</button><button type="button" class="btn ok" data-act="ok">Got it (+1)</button></div>'+
    '<div class="keys"><kbd>\u2192</kbd> or <kbd>Enter</kbd> got it \u00a0 <kbd>\u2190</kbd> skip</div>'+
    '<div class="grow"><button type="button" class="btn ghost" data-act="endearly">End round early</button></div></div>', "play");
  scoreLine(); clearInterval(timer); timer = setInterval(tick, 200); tick();
}
function scoreLine(){ var e = $("#sc"); if(e){ var s = roundScore(); e.textContent = "This round: "+(s>0?"+":"")+s; } }
function tick(){
  var left = Math.max(0, G.deadline - Date.now()), sec = Math.ceil(left/1000);
  var c = $("#clock"), b = $("#barfill"), bar = $("#bar");
  if(c){ c.textContent = sec; c.classList.toggle("hurry", sec<=10); }
  if(bar) bar.classList.toggle("hurry", sec<=10);
  if(b) b.style.transform = "scaleX("+(left/(S.roundSec*1000)).toFixed(4)+")";
  if(left<=0) endRound();
}
function answer(r){
  if(view!=="play") return;
  G.log.push({i:G.cur, r:r}); G.cur = draw();
  var slot = $("#slot"); if(slot) slot.innerHTML = cardHTML(TERMS[G.cur], {swap:true});
  scoreLine();
}
function endRound(){
  if(view!=="play") return;
  clearInterval(timer); timer = null;
  G.deck.push(G.cur);
  renderRoundEnd();
}
function renderRoundEnd(){
  var last = G.turn+1 >= G.total, nxt = G.teams[(G.turn+1)%G.teams.length];
  var rows = G.log.length ? G.log.map(function(e,k){ var t = TERMS[e.i], c = chById[t.ch];
      return '<div class="row" style="--c:'+c.color+'"><span class="sw"></span><div class="tm">'+esc(t.t)+'<small>'+lecture(t)+'</small></div>'+
        '<button type="button" class="tog" data-act="tog" data-val="'+k+'" data-r="'+e.r+'" aria-label="'+esc(t.t)+': '+(e.r==="ok"?"correct":"skipped")+'. Tap to change">'+(e.r==="ok"?"Correct":"Skipped")+'</button></div>'; }).join("")
    : '<p class="sub" style="padding:10px 0">No cards were played this round.</p>';
  var s = roundScore();
  show('<div class="wrap game"><div class="mast-sm"><span class="name">Term Alias</span></div><div class="spectrum" aria-hidden="true" style="margin:8px 0 20px"></div>'+
    '<h2 class="big-h" data-h>Time\u2019s up, '+esc(teamNow().name)+'</h2>'+
    '<p class="sub">Tap a card to fix its result before scoring. <b id="rs">'+(s>0?"+":"")+s+'</b> points this round.</p>'+
    '<div class="panel" id="rows">'+rows+'</div>'+
    '<div class="grow"><button type="button" class="btn wide" data-act="next">'+(last?"See results":"Next: "+esc(nxt.name))+'</button></div></div>', "roundend");
}
function nextTurn(){
  teamNow().score += roundScore();
  G.log.forEach(function(e){ G.all[e.i] = e.r; });
  G.turn++;
  if(G.turn >= G.total) renderGameEnd(); else renderIntro();
}
function renderGameEnd(){
  var max = Math.max.apply(null, G.teams.map(function(t){return t.score;}));
  var winners = G.teams.filter(function(t){return t.score===max;}).map(function(t){return t.name;});
  var sorted = G.teams.slice().sort(function(a,b){return b.score-a.score;});
  var missed = Object.keys(G.all).filter(function(i){return G.all[i]==="skip";}).map(Number);
  var played = Object.keys(G.all).length;
  var list = missed.length ? '<h3 style="margin-top:22px">Worth another look</h3><p class="sub">Skipped this game. Open the lecture to recap.</p><div class="panel">'+missed.map(function(i){ var t = TERMS[i], c = chById[t.ch];
      return '<div class="row" style="--c:'+c.color+'"><span class="sw"></span><div class="tm">'+esc(t.t)+'<small>'+lecture(t)+'</small></div></div>'; }).join("")+'</div>' : "";
  show('<div class="wrap game"><div class="mast-sm"><span class="name">Term Alias</span></div><div class="spectrum" aria-hidden="true" style="margin:8px 0 20px"></div>'+
    '<h2 class="big-h" data-h>'+(winners.length>1?"It\u2019s a tie: ":"")+esc(winners.join(" and "))+(winners.length>1?"":" wins")+'</h2>'+
    '<p class="sub">'+played+' terms came up. '+(missed.length?missed.length+" were skipped.":"None were skipped.")+'</p>'+
    '<ul class="board">'+sorted.map(function(t){ return '<li'+(t.score===max?' class="win"':"")+'><span>'+esc(t.name)+'</span><span class="pts">'+t.score+'</span></li>'; }).join("")+'</ul>'+
    list+
    '<div class="grow"><button type="button" class="btn wide" data-act="start">Play again</button><button type="button" class="btn ghost wide" data-act="home">Back to setup</button></div></div>', "gameend");
}

/* ---------- study mode ---------- */
var ST = null;
function startStudy(list){
  var q = list || shuffle(deckTerms().map(function(t){return t.i;})); if(!q.length) return;
  ST = {queue:q, pos:0, rev:false, good:[], again:[]}; renderStudy();
}
function renderStudy(keep){
  if(ST.pos >= ST.queue.length) return renderStudyEnd();
  var t = TERMS[ST.queue[ST.pos]], n = ST.queue.length;
  var acts = ST.rev
    ? '<div class="actions"><button type="button" class="btn ghost" data-act="again">Review again</button><button type="button" class="btn ok" data-act="good">Got it</button></div><div class="keys"><kbd>\u2192</kbd> got it \u00a0 <kbd>\u2190</kbd> review again</div>'
    : '<div class="actions one"><button type="button" class="btn" data-act="reveal">Show related concepts</button></div><div class="keys"><kbd>Space</kbd> to reveal</div>';
  show('<div class="wrap game"><div class="mast-sm"><span class="name">Study</span><button type="button" class="lnk" data-act="quit">Stop</button></div>'+
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+ST.pos+'"><i style="width:'+(ST.pos/n*100).toFixed(1)+'%"></i></div>'+
    '<p class="sub" data-h>Card '+(ST.pos+1)+' of '+n+'</p><div class="stage">'+cardHTML(t,{study:ST.rev?2:1, swap:!keep})+'</div>'+acts+'</div>', "study", keep);
}
function studyNext(kind){
  var i = ST.queue[ST.pos]; (kind==="good" ? ST.good : ST.again).push(i);
  ST.pos++; ST.rev = false; renderStudy();
}
function renderStudyEnd(){
  var n = ST.queue.length, g = ST.good.length;
  var list = ST.again.length ? '<h3 style="margin-top:22px">Worth another look</h3><div class="panel">'+ST.again.map(function(i){ var t = TERMS[i], c = chById[t.ch];
      return '<div class="row" style="--c:'+c.color+'"><span class="sw"></span><div class="tm">'+esc(t.t)+'<small>'+lecture(t)+'</small></div></div>'; }).join("")+'</div>' : "";
  show('<div class="wrap game"><div class="mast-sm"><span class="name">Study</span></div><div class="spectrum" aria-hidden="true" style="margin:8px 0 20px"></div>'+
    '<h2 class="big-h" data-h>'+g+' of '+n+' felt solid</h2><p class="sub">'+(ST.again.length?"The rest are listed below with their lectures.":"Nothing left to review in this deck.")+'</p>'+list+
    '<div class="grow">'+(ST.again.length?'<button type="button" class="btn wide" data-act="studyagain">Study the '+ST.again.length+' again</button>':"")+
    '<button type="button" class="btn '+(ST.again.length?"ghost ":"")+'wide" data-act="start">New shuffled session</button><button type="button" class="btn ghost wide" data-act="home">Back to setup</button></div></div>', "studyend");
}

/* ---------- print ---------- */
function printCards(){
  var d = deckTerms(), pages = [];
  for(var i=0;i<d.length;i+=9) pages.push(d.slice(i,i+9));
  $("#print").innerHTML = pages.map(function(p){ return '<section class="sheet">'+p.map(function(t){return cardHTML(t);}).join("")+'</section>'; }).join("");
  window.print();
}

/* ---------- events ---------- */
function home(){ clearInterval(timer); timer = null; renderSetup(); }
var actions = {
  mode:function(b){ S.mode = b.dataset.val; save(); renderSetup(true); },
  ch:function(b){ var id = b.dataset.val, k = S.chapters.indexOf(id); if(k>=0) S.chapters.splice(k,1); else S.chapters.push(id); save(); renderSetup(true); },
  allch:function(){ S.chapters = CH.filter(function(c){return countFor(c.id)>0;}).map(function(c){return c.id;}); save(); renderSetup(true); },
  noch:function(){ S.chapters = []; save(); renderSetup(true); },
  exam:function(b){ S.exam = b.checked; save(); renderSetup(true); },
  teams:function(b){ S.teamCount = Math.min(4, Math.max(2, S.teamCount + Number(b.dataset.val))); save(); renderSetup(true); },
  sec:function(b){ S.roundSec = Number(b.dataset.val); save(); renderSetup(true); },
  rounds:function(b){ S.rounds = Number(b.dataset.val); save(); renderSetup(true); },
  penalty:function(b){ S.penalty = b.checked; save(); },
  lang:function(b){ S.lang = b.dataset.val; save(); renderSetup(true); },
  printcards:printCards,
  start:function(){ if(S.mode==="team") startGame(); else startStudy(); },
  startround:startRound,
  ok:function(){ answer("ok"); },
  skip:function(){ answer("skip"); },
  endearly:endRound,
  tog:function(b){ var e = G.log[Number(b.dataset.val)]; e.r = e.r==="ok" ? "skip" : "ok";
        b.dataset.r = e.r; b.textContent = e.r==="ok" ? "Correct" : "Skipped";
        b.setAttribute("aria-label", TERMS[e.i].t+": "+(e.r==="ok"?"correct":"skipped")+". Tap to change");
        var s = roundScore(); $("#rs").textContent = (s>0?"+":"")+s; },
  next:nextTurn,
  quit:function(){ if(confirm("Stop and go back to setup?")) home(); },
  home:home,
  reveal:function(){ ST.rev = true; renderStudy(true); },
  good:function(){ studyNext("good"); },
  again:function(){ studyNext("again"); },
  studyagain:function(){ startStudy(shuffle(ST.again)); }
};
app.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(b.type==="checkbox") return;
  var f = actions[b.dataset.act]; if(f) f(b, e);
});
app.addEventListener("change", function(e){
  var b = e.target.closest("input[data-act]"); if(b && actions[b.dataset.act]) actions[b.dataset.act](b, e);
});
app.addEventListener("input", function(e){
  var el = e.target; if(el.dataset && el.dataset.team!=null){ S.teamNames[Number(el.dataset.team)] = el.value; save(); }
});
document.addEventListener("keydown", function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea") return;
  var onControl = tag==="button" || tag==="a" || tag==="summary";
  var right = e.key==="ArrowRight", left = e.key==="ArrowLeft";
  var enter = (e.key==="Enter" || e.key===" ") && !onControl;
  if(view==="play"){
    if(right || enter){ e.preventDefault(); answer("ok"); }
    else if(left || e.key==="Backspace"){ e.preventDefault(); answer("skip"); }
  } else if(view==="study"){
    if(!ST.rev){ if(enter || right){ e.preventDefault(); ST.rev = true; renderStudy(true); } }
    else if(right || enter){ e.preventDefault(); studyNext("good"); }
    else if(left){ e.preventDefault(); studyNext("again"); }
  }
});
renderSetup();
})();
</script>
</body>
</html>
